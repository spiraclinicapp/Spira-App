<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spira Track · Visitas — Día</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#F4F1EA}
#root{height:100%}
button,input,textarea{font-family:inherit}
a{color:#2E7D74}a:hover{color:#14302E}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(124,140,135,.32);border-radius:99px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
@keyframes v2-scrim{from{opacity:0}to{opacity:1}}
@keyframes v2-scrim-out{from{opacity:1}to{opacity:0}}
@keyframes v2-pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
@keyframes v2-spring{0%{opacity:0;transform:scale(.88) translateY(8px)}60%{opacity:1;transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes v2-fast{from{opacity:0;transform:scale(.99)}to{opacity:1;transform:none}}
@keyframes v2-out{from{opacity:1;transform:none}to{opacity:0;transform:scale(.97) translateY(6px)}}
@keyframes v2-drawer-in{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes v2-drawer-out{from{transform:translateX(0)}to{transform:translateX(100%)}}
@keyframes v2-menu{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes v2-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.65)}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="visitas-v2/data.js"></script>
<script type="text/babel" src="visitas-v2/tweaks-panel.jsx"></script>
<script type="text/babel" src="visitas-v2/atoms.jsx"></script>
<script type="text/babel" src="visitas-v2/rows.jsx"></script>
<script type="text/babel" src="visitas-v2/detail.jsx"></script>
<script type="text/babel" src="visitas-v2/shell.jsx"></script>
</body>
</html>
