function hash(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return Math.abs(h);}
const NOW = new Date('2026-08-20T15:30:00-03:00');
function hoursAgo(n){return new Date(NOW.getTime()-n*3600e3);}
function hoursFrom(d,n){return new Date(d.getTime()+n*3600e3);}
function fmtDT(d){return d.toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}
function fmtRel(hrs){
  const h = Math.abs(Math.round(hrs));
  if (h < 1) return 'menos de 1 h';
  if (h < 24) return h+' h';
  return Math.round(h/24)+' d '+(h%24)+' h';
}

/* Estado determinístico (mock) de un procedimiento dentro de una instancia de visita. */
function baseCompletion(instanceId, procId){
  const h = hash(instanceId+'|'+procId);
  const completed = h % 10 < 8;
  const completedAt = completed ? hoursAgo(2 + (h % 90)) : null;
  return { completed, completedAt };
}
/* Tres etapas del reporte: pendiente → descargado → evolucionado. */
const STAGES = [
  { id:'pendiente', label:'Pendiente', icon:'clock', color:'var(--spira-muted)' },
  { id:'descargado', label:'Descargado', icon:'download', color:DOWNLOAD_COLOR },
  { id:'evolucionado', label:'Evolucionado', icon:'check', color:ACCENT_SOLID },
];
function baseReportStage(instanceId, reportId, completedAt, etaHours){
  const h = hash(instanceId+'|'+reportId);
  const dueAt = hoursFrom(completedAt, etaHours);
  const bucket = h % 10;
  let status = 'pendiente', downloadedAt = null, evolucionadoAt = null;
  if (bucket < 4) { status = 'evolucionado'; downloadedAt = hoursFrom(completedAt, 1+(h%Math.max(1,etaHours))); evolucionadoAt = hoursFrom(downloadedAt, 1+(h%20)); }
  else if (bucket < 7) { status = 'descargado'; downloadedAt = hoursFrom(completedAt, 1+(h%Math.max(1,etaHours))); }
  return { status, downloadedAt, evolucionadoAt, dueAt };
}

/* ---------- Hook: estado editable (mock) de procedimientos y reportes, con historial y cierre de visita ---------- */
function useChecklistState(reportDefs) {
  const [compOverrides, setCompOverrides] = useState({});
  const [reportState, setReportState] = useState({});
  const [closures, setClosures] = useState({});

  function getCompletion(instanceId, procId) {
    const key = instanceId+':'+procId;
    if (compOverrides[key] !== undefined) return compOverrides[key];
    return baseCompletion(instanceId, procId);
  }
  function toggleCompletion(instanceId, procId) {
    const cur = getCompletion(instanceId, procId);
    const next = cur.completed ? { completed:false, completedAt:null } : { completed:true, completedAt: hoursAgo(0) };
    setCompOverrides(o=>({...o, [instanceId+':'+procId]: next}));
  }

  function baseline(instanceId, reportId, completedAt, etaHours) {
    const base = baseReportStage(instanceId, reportId, completedAt, etaHours);
    const seed = hash(instanceId+':'+reportId);
    const history = [{ stage:'pendiente', by:'Sistema', at: completedAt }];
    if (base.status !== 'pendiente') history.push({ stage:'descargado', by: ACTORS[seed % ACTORS.length], at: base.downloadedAt });
    if (base.status === 'evolucionado') history.push({ stage:'evolucionado', by: ACTORS[(seed+1) % ACTORS.length], at: base.evolucionadoAt });
    return { status: base.status, history, dueAt: base.dueAt };
  }
  function getReportState(instanceId, reportId, completedAt, etaHours) {
    const key = instanceId+':'+reportId;
    const base = baseline(instanceId, reportId, completedAt, etaHours);
    const ov = reportState[key];
    const status = ov ? ov.status : base.status;
    const history = ov ? ov.history : base.history;
    const overdue = status === 'pendiente' && NOW > base.dueAt;
    return { status, history, dueAt: base.dueAt, overdue };
  }

  /* Chequea si, tras un cambio, TODOS los reportes de la visita quedaron evolucionados → cierra la visita. */
  function checkClosure(instanceId, actor) {
    const inst = INSTANCES.find(i=>i.id===instanceId);
    const procIds = (DEFAULT_ASSIGN[inst.visitCode]||[]).filter(pid => (reportDefs[pid]||[]).length);
    if (!procIds.length) return;
    const allDone = procIds.every(pid => {
      const comp = getCompletion(instanceId, pid);
      if (!comp.completed) return false;
      return (reportDefs[pid]||[]).every(r => getReportState(instanceId, r.id, comp.completedAt, r.etaHours).status === 'evolucionado');
    });
    if (allDone) setClosures(c => c[instanceId] ? c : ({ ...c, [instanceId]: { at: hoursAgo(0), by: actor } }));
  }

  function setStage(instanceId, reportId, stage, actor, completedAt, etaHours) {
    const cur = getReportState(instanceId, reportId, completedAt, etaHours);
    if (cur.status === stage) return;
    const key = instanceId+':'+reportId;
    setReportState(s => ({ ...s, [key]: { status: stage, history: [...cur.history, { stage, by: actor, at: hoursAgo(0) }] } }));
    if (stage === 'evolucionado') setTimeout(() => checkClosureAfter(instanceId, reportId, actor, completedAt, etaHours), 0);
  }
  /* checkClosure necesita leer el estado recién seteado; como setReportState es async, la evaluamos aparte asumiendo ese reporte en 'evolucionado'. */
  function checkClosureAfter(instanceId, changedReportId, actor) {
    const inst = INSTANCES.find(i=>i.id===instanceId);
    const procIds = (DEFAULT_ASSIGN[inst.visitCode]||[]).filter(pid => (reportDefs[pid]||[]).length);
    if (!procIds.length) return;
    const allDone = procIds.every(pid => {
      const comp = getCompletion(instanceId, pid);
      if (!comp.completed) return false;
      return (reportDefs[pid]||[]).every(r => {
        if (r.id === changedReportId) return true;
        return getReportState(instanceId, r.id, comp.completedAt, r.etaHours).status === 'evolucionado';
      });
    });
    if (allDone) setClosures(c => c[instanceId] ? c : ({ ...c, [instanceId]: { at: hoursAgo(0), by: actor } }));
  }
  function advance(instanceId, reportId, actor, completedAt, etaHours) {
    const cur = getReportState(instanceId, reportId, completedAt, etaHours);
    const idx = STAGES.findIndex(s=>s.id===cur.status);
    if (idx < STAGES.length-1) setStage(instanceId, reportId, STAGES[idx+1].id, actor, completedAt, etaHours);
  }
  function revert(instanceId, reportId, actor, completedAt, etaHours) {
    const cur = getReportState(instanceId, reportId, completedAt, etaHours);
    const idx = STAGES.findIndex(s=>s.id===cur.status);
    if (idx > 0) setStage(instanceId, reportId, STAGES[idx-1].id, actor, completedAt, etaHours);
  }
  return { getCompletion, toggleCompletion, getReportState, setStage, advance, revert, closures };
}

  const flipTimer = useRef(null);
  const assignedSet = useMemo(() => new Set(assigned), [assigned]);
  const canon = PROCS.map(p => p.id);
  const query = q.trim().toLowerCase();
  const available = PROCS.filter(p => !assignedSet.has(p.id) &&
    (!query || p.name.toLowerCase().includes(query) || p.code.toLowerCase().includes(query) || CATS[p.cat].label.toLowerCase().includes(query))
  ).map(p => p.id);
  const assignedProcs = assigned.map(id => PMAP[id]);
  const availProcs = available.map(id => PMAP[id]);
  const totalMin = assigned.reduce((s,id) => s + PMAP[id].min, 0);

  useEffect(() => { const k = e => { if (e.key === 'Escape') onClose(); }; document.addEventListener('keydown', k); return () => document.removeEventListener('keydown', k); }, [onClose]);
  useLayoutEffect(() => {
    const nodes = wrapRef.current ? wrapRef.current.querySelectorAll('[data-fid]') : [];
    const now = new Map();
    nodes.forEach(n => now.set(n.dataset.fid, n.getBoundingClientRect()));
    let moved = false;
    nodes.forEach(n => {
      const id = n.dataset.fid, prev = prevRects.current.get(id), next = now.get(id);
      if (prev) {
        const dx = prev.left - next.left, dy = prev.top - next.top;
        if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
          moved = true;
          n.style.transition = 'none'; n.style.transform = `translate(${dx}px,${dy}px)`; n.style.zIndex = '5';
          requestAnimationFrame(() => {
            n.style.transition = 'transform .34s cubic-bezier(.22,.7,.3,1)'; n.style.transform = '';
            const clear = () => { n.style.zIndex=''; n.style.transition=''; n.removeEventListener('transitionend', clear); };
            n.addEventListener('transitionend', clear);
          });
        }
      } else if (prevRects.current.size) {
        n.style.transition='none'; n.style.opacity='0'; n.style.transform='scale(.95)';
        requestAnimationFrame(() => { n.style.transition='opacity .28s ease,transform .28s ease'; n.style.opacity=''; n.style.transform=''; });
      }
    });
    prevRects.current = now;
    if (moved) { clearTimeout(flipTimer.current); wrapRef.current.dataset.flipping = '1'; flipTimer.current = setTimeout(() => { if (wrapRef.current) wrapRef.current.dataset.flipping = '0'; }, 380); }
  });

  const clearSel = () => setSel(new Set());
  const toggle = (id) => setSel(s => { const n = new Set(s); n.has(id)?n.delete(id):n.add(id); return n; });
  function add(ids, at) {
    const set = new Set(ids);
    setAssigned(a => {
      const rest = a.filter(x => !set.has(x));
      const incoming = canon.filter(x => set.has(x) && !a.includes(x));
      const already = a.filter(x => set.has(x));
      const insert = [...incoming, ...already];
      if (at == null || at >= rest.length) return [...rest, ...insert];
      return [...rest.slice(0,at), ...insert, ...rest.slice(at)];
    });
  }
  function remove(ids) { const set = new Set(ids); setAssigned(a => a.filter(x => !set.has(x))); }
  const selIn = (list) => list.filter(id => sel.has(id));
  const moveSelRight = () => { const ids = selIn(available); if (ids.length){ add(ids); setSel(s=>{const n=new Set(s); ids.forEach(i=>n.delete(i)); return n;}); } };
  const moveSelLeft  = () => { const ids = selIn(assigned); if (ids.length){ remove(ids); setSel(s=>{const n=new Set(s); ids.forEach(i=>n.delete(i)); return n;}); } };
  const allRight = () => { add(available); clearSel(); };
  const allLeft  = () => { remove(assigned); clearSel(); };
  const selAvailCount = selIn(available).length;
  const selAssignedCount = selIn(assigned).length;
  const onDragStart = (id, from) => (e) => { setDrag({ id, from }); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', id); } catch(_) {} };
  const endDrag = () => { setDrag(null); setOverSide(null); setDropIdx(null); };
  const dropToAssigned = (e) => { e.preventDefault(); if (!drag) return; const ids = sel.has(drag.id) ? [...sel] : [drag.id]; add(ids, dropIdx); setSel(s=>{const n=new Set(s); ids.forEach(i=>n.delete(i)); return n;}); endDrag(); };
  const dropToAvail = (e) => { e.preventDefault(); if (!drag) return; if (drag.from === 'assigned') { const ids = sel.has(drag.id) ? selIn(assigned) : [drag.id]; remove(ids); setSel(s=>{const n=new Set(s); ids.forEach(i=>n.delete(i)); return n;}); } endDrag(); };
  const dropZone = (side) => ({ onDragOver: (e) => { e.preventDefault(); setOverSide(side); if (side==='assigned' && dropIdx==null) setDropIdx(assigned.length); }, onDragLeave: (e) => { if (!e.currentTarget.contains(e.relatedTarget)) { setOverSide(null); if(side==='assigned') setDropIdx(null); } }, onDrop: side==='assigned' ? dropToAssigned : dropToAvail });
  const panel = (highlight) => ({ flex:1, minWidth:0, display:'flex', flexDirection:'column', border:'1px solid '+(highlight?ACCENT:'var(--spira-line)'), borderRadius:14, background: highlight?'rgba(46,125,116,.04)':'var(--spira-surface)', boxShadow: highlight?'0 0 0 3px rgba(46,125,116,.12)':'none', transition:'border-color .15s ease, box-shadow .15s ease, background .15s ease', overflow:'hidden' });
  const panelHead = { display:'flex', alignItems:'center', gap:8, padding:'12px 14px 10px' };
  const listStyle = { flex:1, minHeight:0, overflowY:'auto', padding:'2px 10px 12px', display:'flex', flexDirection:'column', gap:6 };
  const moveBtn = (enabled) => ({ width:38, height:34, borderRadius:9, display:'grid', placeItems:'center', border:'1px solid var(--spira-line-2)', background:'var(--spira-white)', color: enabled?ACCENT:'var(--spira-faint)', cursor: enabled?'pointer':'default', opacity: enabled?1:.5 });

  function ProcCard({ p, selected, onClick, onDoubleClick, onDragStart, onDragEnd, dragging, showGrip }) {
    const c = CATS[p.cat]; const hasRep = (reportDefs[p.id]||[]).length>0;
    return (
      <div className="procItem" data-fid={p.id} draggable onClick={onClick} onDoubleClick={onDoubleClick} onDragStart={onDragStart} onDragEnd={onDragEnd}
        style={{ display:'flex', alignItems:'center', gap:10, padding:'8px 10px', borderRadius:10, border:'1px solid '+(selected?ACCENT:'var(--spira-line)'), background: selected?'rgba(46,125,116,.09)':'var(--spira-white)', boxShadow: selected?'inset 0 0 0 1px '+ACCENT:'none', cursor:'grab', userSelect:'none', opacity: dragging?0.4:1 }}>
        {showGrip && <span style={{color:'var(--spira-faint)', flex:'0 0 auto', display:'grid', placeItems:'center', marginLeft:-2}}><Icon name="grip" size={15}/></span>}
        <span style={{width:8, height:8, borderRadius:99, background:c.color, flex:'0 0 auto'}}/>
        <span style={{flex:1, minWidth:0}}>
          <span style={{display:'block', fontSize:13.5, fontWeight:600, color:'var(--spira-ink)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>{p.name}</span>
          <span style={{display:'block', fontSize:11, color:'var(--spira-faint)', marginTop:1}}>{c.label} · ~{p.min} min</span>
        </span>
        {hasRep && <Icon name="fileText" size={13} color="var(--spira-faint)" title="Tiene reportes"/>}
        <span className="spira-mono" style={{fontSize:11, fontWeight:600, color:selected?ACCENT:'var(--spira-muted)', letterSpacing:'.01em', flex:'0 0 auto'}}>{p.code}</span>
      </div>
    );
  }

  return (
    <div onMouseDown={onClose} role="presentation" style={{ position:'fixed', inset:0, background:'rgba(20,48,46,.34)', backdropFilter:'blur(2px)', display:'grid', placeItems:'center', zIndex:50, padding:24, animation:'overlayIn .16s ease' }}>
      <div role="dialog" aria-modal="true" onMouseDown={e=>e.stopPropagation()} style={{ width:'min(920px,100%)', maxHeight:'calc(100vh - 48px)', background:'var(--spira-white)', border:'1px solid var(--spira-line)', borderRadius:18, boxShadow:'var(--spira-shadow-lg)', display:'flex', flexDirection:'column', overflow:'hidden', animation:'cardIn .22s cubic-bezier(.22,.7,.3,1)' }}>
        <div style={{display:'flex', alignItems:'center', gap:13, padding:'20px 22px 16px', borderBottom:'1px solid var(--spira-line)'}}>
          <span style={{width:38, height:38, flex:'0 0 auto', borderRadius:10, background:'rgba(46,125,116,.12)', display:'grid', placeItems:'center'}}><Icon name="clip" size={19} color={ACCENT} stroke={1.9}/></span>
          <div style={{flex:1, minWidth:0}}>
            <div className="spira-h2" style={{fontSize:20, lineHeight:1.1}}>Procedimientos de la visita</div>
            <div style={{fontSize:12.5, color:'var(--spira-muted)', marginTop:3, display:'flex', alignItems:'center', gap:7}}>
              <span className="spira-mono" style={{fontWeight:600, color:ACCENT}}>{visit.code}</span><span style={{color:'var(--spira-line-2)'}}>·</span>
              <span style={{fontWeight:600, color:'var(--spira-ink)'}}>{visit.name}</span><span style={{color:'var(--spira-line-2)'}}>·</span><span>día {visit.day}</span>
            </div>
          </div>
          <button className="xbtn" onClick={onClose} aria-label="Cerrar" style={{width:34, height:34, border:'none', borderRadius:9, background:'transparent', cursor:'pointer', display:'grid', placeItems:'center'}}><Icon name="x" size={18} color="var(--spira-muted)"/></button>
        </div>
        <div ref={wrapRef} data-flipping="0" style={{position:'relative', display:'flex', alignItems:'stretch', gap:14, padding:'16px 22px', minHeight:0}}>
          <style>{`[data-flipping="1"] .procScroll{overflow:visible !important}`}</style>
          <div style={panel(overSide==='avail')} {...dropZone('avail')}>
            <div style={panelHead}><span className="spira-eyebrow" style={{flex:1}}>Disponibles</span><span style={{fontSize:11.5, fontWeight:600, color:'var(--spira-faint)', fontVariantNumeric:'tabular-nums'}}>{available.length}</span></div>
            <div style={{padding:'0 10px 8px'}}>
              <div style={{display:'flex', alignItems:'center', gap:8, height:36, padding:'0 10px', border:'1px solid var(--spira-line-2)', borderRadius:9, background:'var(--spira-white)'}}>
                <Icon name="search" size={15} color="var(--spira-faint)"/>
                <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar procedimiento…" style={{flex:1, border:'none', outline:'none', background:'transparent', fontSize:13, color:'var(--spira-ink)', fontFamily:'inherit'}}/>
                {q && <button onClick={()=>setQ('')} className="xbtn" style={{border:'none', background:'transparent', cursor:'pointer', display:'grid', placeItems:'center', padding:2, borderRadius:6}}><Icon name="x" size={14} color="var(--spira-faint)"/></button>}
              </div>
            </div>
            <div className="scroll procScroll" style={listStyle}>
              {availProcs.length === 0 ? <div style={{padding:'26px 8px', textAlign:'center', color:'var(--spira-faint)', fontSize:12.5}}>{query ? 'Sin resultados para «'+q+'»' : 'Todos los procedimientos están en la visita.'}</div>
                : availProcs.map(p => <ProcCard key={p.id} p={p} selected={sel.has(p.id)} onClick={()=>toggle(p.id)} onDoubleClick={()=>{ add([p.id]); setSel(s=>{const n=new Set(s);n.delete(p.id);return n;}); }} onDragStart={onDragStart(p.id,'avail')} onDragEnd={endDrag} dragging={drag&&drag.id===p.id}/>)}
            </div>
          </div>
          <div style={{display:'flex', flexDirection:'column', justifyContent:'center', gap:8, flex:'0 0 auto'}}>
            <button className="moveBtn" style={moveBtn(selAvailCount>0)} disabled={!selAvailCount} onClick={moveSelRight} title="Mover seleccionados →"><Icon name="chevRight" size={18}/></button>
            <button className="moveBtn" style={moveBtn(available.length>0)} disabled={!available.length} onClick={allRight} title="Mover todos →"><Icon name="dblRight" size={17}/></button>
            <div style={{height:6}}/>
            <button className="moveBtn" style={moveBtn(selAssignedCount>0)} disabled={!selAssignedCount} onClick={moveSelLeft} title="← Quitar seleccionados"><Icon name="chevLeft" size={18}/></button>
            <button className="moveBtn" style={moveBtn(assigned.length>0)} disabled={!assigned.length} onClick={allLeft} title="← Quitar todos"><Icon name="dblLeft" size={17}/></button>
          </div>
          <div style={panel(overSide==='assigned')} {...dropZone('assigned')}>
            <div style={panelHead}><span className="spira-eyebrow" style={{flex:1, color:ACCENT}}>En esta visita</span><span style={{fontSize:11.5, fontWeight:700, color:ACCENT, fontVariantNumeric:'tabular-nums', background:'rgba(46,125,116,.12)', padding:'2px 8px', borderRadius:99}}>{assigned.length}</span></div>
            <div className="scroll procScroll" style={{...listStyle, paddingTop:8}} onDragOver={(e)=>{ if(drag){ e.preventDefault(); if(dropIdx==null) setDropIdx(assigned.length);} }}>
              {assignedProcs.length === 0 ? <div style={{margin:'8px 0', flex:1, minHeight:150, display:'grid', placeItems:'center', border:'1.5px dashed var(--spira-line-2)', borderRadius:12, color:'var(--spira-faint)', fontSize:12.5, textAlign:'center', padding:16}}>Arrastrá o seleccioná procedimientos<br/>desde la izquierda.</div>
                : assignedProcs.map((p, i) => (
                  <div key={p.id} onDragOver={(e)=>{ if(drag){ e.preventDefault(); const r=e.currentTarget.getBoundingClientRect(); setDropIdx(e.clientY < r.top+r.height/2 ? i : i+1);} }} style={{position:'relative'}}>
                    {drag && dropIdx===i && <div style={{position:'absolute', top:-4, left:2, right:2, height:2, background:ACCENT, borderRadius:2}}/>}
                    <ProcCard p={p} selected={sel.has(p.id)} showGrip onClick={()=>toggle(p.id)} onDoubleClick={()=>{ remove([p.id]); setSel(s=>{const n=new Set(s);n.delete(p.id);return n;}); }} onDragStart={onDragStart(p.id,'assigned')} onDragEnd={endDrag} dragging={drag&&drag.id===p.id}/>
                    {drag && dropIdx===i+1 && i===assignedProcs.length-1 && <div style={{position:'absolute', bottom:-4, left:2, right:2, height:2, background:ACCENT, borderRadius:2}}/>}
                  </div>
                ))}
            </div>
          </div>
        </div>
        <div style={{display:'flex', alignItems:'center', gap:12, padding:'14px 22px', borderTop:'1px solid var(--spira-line)', background:'var(--spira-surface)'}}>
          <div style={{flex:1, display:'flex', alignItems:'center', gap:14, fontSize:12.5, color:'var(--spira-muted)'}}>
            <span style={{display:'inline-flex', alignItems:'center', gap:6}}><Icon name="check" size={14} color={ACCENT}/><b style={{color:'var(--spira-ink)', fontWeight:700}}>{assigned.length}</b> {assigned.length===1?'procedimiento':'procedimientos'}</span>
            <span style={{display:'inline-flex', alignItems:'center', gap:6}}><Icon name="clock" size={14} color="var(--spira-faint)"/>~{totalMin} min estimados</span>
          </div>
          <button onClick={onClose} style={{height:40, padding:'0 16px', border:'1px solid var(--spira-line-2)', borderRadius:10, background:'var(--spira-white)', color:'var(--spira-ink)', fontWeight:600, fontSize:14, cursor:'pointer'}}>Cancelar</button>
          <button onClick={()=>onSave(assigned)} style={{height:40, padding:'0 18px', border:'none', borderRadius:10, background:ACCENT_SOLID, color:'var(--spira-on-accent)', fontWeight:600, fontSize:14, cursor:'pointer'}}>Guardar procedimientos</button>
        </div>
      </div>
    </div>
  );
}

/* ================= Modal: Reportes de un procedimiento (catálogo del protocolo) ================= */
function NameCombo({ value, onChange, known }){
  const [open,setOpen]=useState(false);
  const inputRef=useRef(null), wrapRef=useRef(null);
  const names = known.map(k=>k.name);
  const q=value.trim().toLowerCase();
  const filtered = q ? names.filter(o=>o.toLowerCase().includes(q)) : names;
  useEffect(()=>{ function onDoc(e){ if(wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); } document.addEventListener('mousedown',onDoc); return ()=>document.removeEventListener('mousedown',onDoc); },[]);
  function handleChange(e){
    const typed=e.target.value, isDelete = e.nativeEvent && e.nativeEvent.inputType==='deleteContentBackward';
    onChange(typed); setOpen(true);
    if (!typed || isDelete) return;
    const match = names.find(o=>o.toLowerCase().startsWith(typed.toLowerCase()) && o.toLowerCase()!==typed.toLowerCase());
    if (match){ onChange(match); requestAnimationFrame(()=>{ if(inputRef.current) inputRef.current.setSelectionRange(typed.length, match.length); }); }
  }
  function pick(name){ onChange(name); setOpen(false); }
  return (
    <div ref={wrapRef} style={{position:'relative'}}>
      <div style={{display:'flex', alignItems:'center', border:'1px solid var(--spira-line-2)', borderRadius:8, background:'var(--spira-white)', height:36}}>
        <input ref={inputRef} value={value} onChange={handleChange} onFocus={()=>setOpen(true)}
          onKeyDown={e=>{ if(e.key==='Escape') setOpen(false); else if(e.key==='Enter' && filtered[0]){ pick(filtered[0]); e.preventDefault(); } }}
          placeholder="Elegí uno existente o escribí uno nuevo" style={{flex:1, height:'100%', border:'none', outline:'none', padding:'0 10px', fontSize:13, background:'transparent', color:'var(--spira-ink)', fontFamily:'inherit', borderRadius:'8px 0 0 8px'}}/>
        <button type="button" onClick={()=>{ setOpen(o=>!o); inputRef.current && inputRef.current.focus(); }} style={{width:32, height:'100%', border:'none', borderLeft:'1px solid var(--spira-line)', background:'transparent', cursor:'pointer', display:'grid', placeItems:'center'}}>
          <Icon name="chevDown" size={13} color="var(--spira-muted)" stroke={2}/>
        </button>
      </div>
      {open && (
        <div className="scroll" style={{position:'absolute', top:'calc(100% + 4px)', left:0, right:0, background:'var(--spira-white)', border:'1px solid var(--spira-line-2)', borderRadius:9, boxShadow:'var(--spira-shadow-sm)', maxHeight:200, overflowY:'auto', zIndex:20}}>
          {filtered.length===0 && <div style={{padding:'9px 12px', fontSize:12, color:'var(--spira-faint)'}}>Sin coincidencias — se creará «{value}» como nuevo.</div>}
          {filtered.map(o=>{ const k = known.find(x=>x.name===o); return (
            <button key={o} type="button" className="comboOpt" onClick={()=>pick(o)} style={{display:'flex', width:'100%', textAlign:'left', alignItems:'center', gap:8, padding:'8px 12px', border:'none', background:'transparent', cursor:'pointer', fontSize:12.5}}>
              <span style={{flex:1}}>{o}</span>
              <span style={{fontSize:10.5, fontWeight:700, color:PLATFORMS[k.platform].color}}>{PLATFORMS[k.platform].label}</span>
            </button>
          );})}
        </div>
      )}
    </div>
  );
}

function ReportForm({ initial, known, onCancel, onSave }) {
  const [f, setF] = useState(initial || { name:'', platform:'labcorp', link:PLATFORMS.labcorp.url, etaHours:24, notes:'' });
  const [linkTouched, setLinkTouched] = useState(!!initial);
  const upd = (k,v) => setF(s=>({...s,[k]:v}));
  function onNameChange(v){
    const match = known.find(k=>k.name.toLowerCase()===v.toLowerCase());
    if (match) setF(s=>({ ...s, name:v, platform:match.platform, etaHours:match.etaHours, link: linkTouched ? s.link : PLATFORMS[match.platform].url }));
    else upd('name', v);
  }
  function onPlatformChange(v){ upd('platform', v); if (!linkTouched) upd('link', PLATFORMS[v].url); }
  const fieldStyle = { width:'100%', height:36, padding:'0 10px', border:'1px solid var(--spira-line-2)', borderRadius:8, background:'var(--spira-white)', fontSize:13, fontFamily:'inherit', color:'var(--spira-ink)' };
  const label = { display:'block', fontSize:11.5, fontWeight:600, color:'var(--spira-muted)', marginBottom:4 };
  const help = { fontSize:11, color:'var(--spira-faint)', marginTop:4 };

      <div>
        <span style={label}>Link directo a la plataforma</span>

        <div style={{display:'flex', gap:8, flexWrap:'wrap', alignItems:'center'}}>

          ))}
          <div style={{display:'flex', alignItems:'center', gap:6}}>
            <input type="number" min="0" style={{...fieldStyle, width:70, height:32}} value={f.etaHours} onChange={e=>upd('etaHours', Number(e.target.value)||0)}/>

      <div style={{display:'flex', justifyContent:'flex-end', gap:8}}>
        <button onClick={onCancel} style={{height:34, padding:'0 14px', border:'1px solid var(--spira-line-2)', borderRadius:8, background:'var(--spira-white)', fontWeight:600, fontSize:13, cursor:'pointer'}}>Cancelar</button>
        <button onClick={()=>f.name.trim() && onSave({...f, id:f.id||('r'+Date.now())})} disabled={!f.name.trim()} style={{height:34, padding:'0 16px', border:'none', borderRadius:8, background:ACCENT_SOLID, color:'var(--spira-on-accent)', fontWeight:600, fontSize:13, cursor:f.name.trim()?'pointer':'default', opacity:f.name.trim()?1:.6}}>Guardar reporte</button>
      </div>
    </div>
  );
}

function ProcedureFields({ value, onChange }) {
  const [catOpen, setCatOpen] = useState(false);
  const fieldStyle = { width:'100%', height:36, padding:'0 10px', border:'1px solid var(--spira-line-2)', borderRadius:8, background:'var(--spira-white)', fontSize:13, fontFamily:'inherit', color:'var(--spira-ink)' };
  const label = { display:'block', fontSize:11.5, fontWeight:600, color:'var(--spira-muted)', marginBottom:4 };
  const help = { fontSize:11, color:'var(--spira-faint)', marginTop:4 };
  const c = CATS[value.cat];
  const MIN_PRESETS = [5,10,15,20,30,45,60,90];
  return (
    <div style={{display:'flex', flexDirection:'column', gap:14}}>
      <div><span style={label}>Nombre</span><input style={fieldStyle} value={value.name} onChange={e=>onChange({...value,name:e.target.value})} placeholder="Ej. Electrocardiograma"/></div>
      <div style={{display:'grid', gridTemplateColumns:'110px 1fr', gap:10}}>
        <div><span style={label}>Iniciales</span><input className="spira-mono" style={{...fieldStyle, textAlign:'center'}} value={value.code} onChange={e=>onChange({...value,code:e.target.value})} placeholder="ECG"/></div>
        <div style={{position:'relative'}}>
          <span style={label}>Categoría</span>
          <button type="button" onClick={()=>setCatOpen(o=>!o)} style={{...fieldStyle, display:'flex', alignItems:'center', gap:8, cursor:'pointer', textAlign:'left'}}>
            <span style={{width:8, height:8, borderRadius:99, background:c.color, flex:'0 0 auto'}}/>
            <span style={{flex:1, fontWeight:600}}>{c.label}</span>
            <Icon name="chevRight" size={13} color="var(--spira-muted)" stroke={2.2} style={{transform:'rotate(90deg)'}}/>
          </button>
          {catOpen && (
            <div className="scroll" style={{position:'absolute', top:'calc(100% + 4px)', left:0, right:0, background:'var(--spira-white)', border:'1px solid var(--spira-line-2)', borderRadius:9, boxShadow:'var(--spira-shadow-sm)', zIndex:10, maxHeight:220, overflowY:'auto'}}>
              {Object.entries(CATS).map(([id,cc])=>(
                <button key={id} type="button" onClick={()=>{onChange({...value,cat:id}); setCatOpen(false);}} style={{display:'flex', alignItems:'center', gap:8, width:'100%', padding:'9px 12px', border:'none', background: id===value.cat?'var(--spira-surface)':'transparent', cursor:'pointer', fontSize:13}}>
                  <span style={{width:8,height:8,borderRadius:99,background:cc.color}}/>{cc.label}
                </button>
              ))}
            </div>
          )}
        </div>
      </div>
      <div>
        <span style={label}>Demora estimada</span>
        <select style={fieldStyle} value={MIN_PRESETS.includes(value.min)?value.min:'otra'} onChange={e=>{ if(e.target.value!=='otra') onChange({...value,min:Number(e.target.value)}); }}>
          {MIN_PRESETS.map(m=><option key={m} value={m}>{m} min</option>)}
          <option value="otra">Otra…</option>
        </select>
        {!MIN_PRESETS.includes(value.min) && <input type="number" min="0" style={{...fieldStyle, width:120, marginTop:8}} value={value.min} onChange={e=>onChange({...value,min:Number(e.target.value)||0})}/>}
        <div style={help}>Cuánto dura el procedimiento en promedio, de principio a fin.</div>
      </div>
    </div>
  );
}

/* ================= Sub-vista: Procedimientos del estudio (catálogo + reportes) ================= */
function ProcedimientosView({ catalog, setCatalog, reportDefs, setReportDefs }) {
  const [q, setQ] = useState('');
  const [editingProc, setEditingProc] = useState(null);
  const [adding, setAdding] = useState(false);
  const knownReports = useMemo(() => {
    const map = new Map();
    Object.values(reportDefs).flat().forEach(r => { if (!map.has(r.name)) map.set(r.name, { name:r.name, platform:r.platform, etaHours:r.etaHours }); });
    return [...map.values()];
  }, [reportDefs]);
  const query = q.trim().toLowerCase();
  const byCat = {};
  catalog.filter(p => !query || p.name.toLowerCase().includes(query) || (p.code||'').toLowerCase().includes(query) || CATS[p.cat].label.toLowerCase().includes(query))
    .forEach(p => { (byCat[p.cat] = byCat[p.cat]||[]).push(p); });
  // (panel de reportes independiente retirado: ahora se gestiona dentro de "Editar procedimiento")

  return (
    <div>
      <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:18, flexWrap:'wrap'}}>
        <div style={{display:'flex', alignItems:'center', gap:8, height:38, padding:'0 12px', border:'1px solid var(--spira-line-2)', borderRadius:10, background:'var(--spira-white)', minWidth:260}}>
          <Icon name="search" size={15} color="var(--spira-faint)"/>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar procedimiento…" style={{flex:1, border:'none', outline:'none', background:'transparent', fontSize:13, fontFamily:'inherit', color:'var(--spira-ink)'}}/>
        </div>
        <div style={{flex:1}}/>
        <button onClick={()=>setAdding(a=>!a)} style={{height:38, padding:'0 15px', border:'none', borderRadius:10, background:ACCENT_SOLID, color:'var(--spira-on-accent)', fontWeight:600, fontSize:13.5, cursor:'pointer', display:'inline-flex', alignItems:'center', gap:6}}><Icon name="plus" size={15} color="var(--spira-on-accent)"/>Procedimiento</button>
      </div>
      {adding && <ProcedureForm onCancel={()=>setAdding(false)} onSave={(p)=>{ setCatalog(c=>[...c,p]); setAdding(false); }}/>}
      {Object.entries(CATS).filter(([id])=>byCat[id]).map(([id,c]) => (
        <div key={id} style={{marginBottom:18}}>
          <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:8}}>
            <span style={{width:7,height:7,borderRadius:99,background:c.color}}/>
            <span className="spira-eyebrow">{c.label}</span>
          </div>
          <div style={{border:'1px solid var(--spira-line)', borderRadius:12, overflow:'hidden', background:'var(--spira-white)'}}>
            {byCat[id].map((p,i) => {
              const reports = reportDefs[p.id] || [];
              return (
                <div key={p.id} className="catRow" style={{display:'flex', alignItems:'center', gap:12, padding:'11px 14px', borderTop: i>0?'1px solid var(--spira-line)':'none'}}>
                  <div onClick={()=>setEditingProc(p)} title="Editar procedimiento" style={{flex:1, minWidth:0, cursor:'pointer'}}>
                    <div style={{fontSize:13.5, fontWeight:600, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>{p.name}</div>
                    <div style={{fontSize:11, color:'var(--spira-faint)', marginTop:1}}>~{p.min} min</div>
                  </div>
                  <button className="linkBtn" onClick={()=>setEditingProc(p)} style={{display:'inline-flex', alignItems:'center', gap:7, height:30, padding:'0 8px 0 10px', border:'1px solid var(--spira-line)', borderRadius:99, background:'var(--spira-white)', cursor:'pointer'}}>
                    <Icon name="fileText" size={13} color={reports.length?ACCENT:'var(--spira-faint)'}/>
                    {reports.length ? <span style={{fontSize:12.5, fontWeight:600}}><b style={{color:ACCENT}}>{reports.length}</b> {reports.length===1?'reporte':'reportes'}</span> : <span style={{fontSize:12.5, color:'var(--spira-muted)'}}>Sin reportes</span>}
                    <Icon name="chevRight" size={13} color="var(--spira-faint)"/>
                  </button>
                  {reports.length>0 && <div style={{display:'flex', gap:4}}>{reports.slice(0,3).map(r=><span key={r.id} title={r.name+' · '+PLATFORMS[r.platform].label} style={{width:7,height:7,borderRadius:99,background:PLATFORMS[r.platform].color}}/>)}</div>}
                  <span className="spira-mono" style={{fontSize:11, color:'var(--spira-muted)'}}>{p.code}</span>
                  <button className="xbtn" style={{width:28, height:28, border:'1px solid var(--spira-line-2)', borderRadius:7, background:'var(--spira-white)', cursor:'pointer', display:'grid', placeItems:'center'}} title="Eliminar" onClick={()=>{ if(!(reportDefs[p.id]||[]).length) setCatalog(c=>c.filter(x=>x.id!==p.id)); }}><Icon name="trash" size={13} color="var(--spira-muted)"/></button>
                </div>
              );
            })}
          </div>
        </div>
      ))}
      {editingProc && (
        <ProcedureEditModal proc={editingProc} reports={reportDefs[editingProc.id]||[]} known={knownReports}
          onClose={()=>setEditingProc(null)}
          onSaveProc={(p)=>{ setCatalog(c=>c.map(x=>x.id===p.id?p:x)); setEditingProc(p); }}
          onAddReport={(r)=>setReportDefs(d=>({...d,[editingProc.id]:[...(d[editingProc.id]||[]),r]}))}
          onEditReport={(r)=>setReportDefs(d=>({...d,[editingProc.id]:(d[editingProc.id]||[]).map(x=>x.id===r.id?r:x)}))}
          onDeleteReport={(id)=>setReportDefs(d=>({...d,[editingProc.id]:(d[editingProc.id]||[]).filter(x=>x.id!==id)}))}/>
      )}
    </div>
  );
}

/* ================= Tarjeta del tablero (Kanban de reportes) ================= */

  const plat = PLATFORMS[report.platform] || PLATFORMS.otro;
  const timeText = state.status==='evolucionado' ? 'Evolucionado ' + fmtDT(state.history[state.history.length-1].at)

      </div>
      <a className="platBtn" href={plat.url} target="_blank" rel="noreferrer" onClick={e=>e.stopPropagation()}
        style={{display:'inline-flex', alignItems:'center', justifyContent:'center', gap:6, height:28, borderRadius:8, background:plat.color+'1c', color:plat.color, fontSize:11.5, fontWeight:700, textDecoration:'none'}}>
        Abrir en {plat.label}<Icon name="extLink" size={11} stroke={2.2}/>
      </a>
      <div style={{fontSize:10.5, fontWeight:600, color: state.status==='pendiente'&&state.overdue ? OVERDUE_COLOR : 'var(--spira-muted)'}}>{timeText}</div>
      <div style={{display:'flex', alignItems:'center', gap:6}}>
        {next && (
          <button className="advBtn" onClick={()=>checklist.advance(instanceId, report.id, actor, card.completedAt, report.etaHours)}
            style={{flex:1, height:30, border:'none', borderRadius:8, background:next.color, color:'var(--spira-on-accent)', fontSize:11.5, fontWeight:700, cursor:'pointer', display:'inline-flex', alignItems:'center', justifyContent:'center', gap:6}}>
            <Icon name={next.icon} size={12} stroke={2.4}/>Marcar {next.label.toLowerCase()}
          </button>
        )}
        {!next && <span style={{flex:1, height:30, display:'inline-flex', alignItems:'center', justifyContent:'center', gap:6, fontSize:11.5, fontWeight:700, color:ACCENT}}><Icon name="check" size={13}/>Evolucionado</span>}
        <button className="xbtn" onClick={()=>checklist.revert(instanceId, report.id, actor, card.completedAt, report.etaHours)} title="Retroceder etapa" style={{width:30, height:30, border:'1px solid var(--spira-line-2)', borderRadius:8, background:'var(--spira-white)', cursor:'pointer', display:'grid', placeItems:'center'}}><Icon name="undo" size={13} color="var(--spira-muted)"/></button>
      </div>
      <button onClick={()=>setShowHist(h=>!h)} style={{display:'inline-flex', alignItems:'center', gap:5, border:'none', background:'transparent', color:'var(--spira-faint)', fontSize:10.5, cursor:'pointer', padding:0, alignSelf:'flex-start'}}>
        <Icon name="list" size={11}/>Historial ({state.history.length})<Icon name="chevDown" size={10} style={{transform:showHist?'rotate(180deg)':'none', transition:'transform .15s'}}/>
      </button>
      {showHist && (
        <div style={{borderTop:'1px solid var(--spira-line)', paddingTop:7, display:'flex', flexDirection:'column', gap:4}}>
          {state.history.map((h,i) => (
            <div key={i} style={{fontSize:10.5, color:'var(--spira-muted)', display:'flex', gap:5}}>
              <span className="spira-mono" style={{color:'var(--spira-faint)', flex:'0 0 auto'}}>{fmtDT(h.at)}</span>
              <span>{STAGES.find(s=>s.id===h.stage).label} · {h.by}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ================= Tab: Reportes pendientes del protocolo (tablero kanban) ================= */
function ReportesPendientesTab({ reportDefs, assign, setAssign }) {
  const checklist = useChecklistState(reportDefs);
  const [visitFilter, setVisitFilter] = useState('todas');
  const [platFilter, setPlatFilter] = useState('todas');
  const [actor, setActor] = useState(CURRENT_USERS[0]);
  const [dragCard, setDragCard] = useState(null);
  const [dragOverCol, setDragOverCol] = useState(null);
  const [openVisit, setOpenVisit] = useState(null);

  const instances = INSTANCES.filter(i => visitFilter==='todas' || i.visitCode===visitFilter);
  const cards = [];
  instances.forEach(inst => {
    if (checklist.closures[inst.id]) return; // visita cerrada → sale del tablero activo
    const patient = PATIENTS.find(p=>p.id===inst.patientId);
    const visit = VISITS.find(v=>v.code===inst.visitCode);
    (DEFAULT_ASSIGN[inst.visitCode]||[]).forEach(pid => {
      let reports = reportDefs[pid] || [];
      if (!reports.length) return;
      if (platFilter!=='todas') reports = reports.filter(r=>r.platform===platFilter);
      if (!reports.length) return;
      const comp = checklist.getCompletion(inst.id, pid);
      if (!comp.completed) return;
      reports.forEach(r => {
        const state = checklist.getReportState(inst.id, r.id, comp.completedAt, r.etaHours);
        cards.push({ instanceId: inst.id, patient, visit, proc: PMAP[pid], report: r, state, completedAt: comp.completedAt });
      });
    });
  });

  const closedList = Object.entries(checklist.closures)
    .filter(([iid]) => visitFilter==='todas' || INSTANCES.find(i=>i.id===iid).visitCode===visitFilter)
    .map(([iid, c]) => { const inst = INSTANCES.find(i=>i.id===iid); return { inst, patient: PATIENTS.find(p=>p.id===inst.patientId), visit: VISITS.find(v=>v.code===inst.visitCode), ...c }; })
    .sort((a,b)=>b.at-a.at);

  const overdueCount = cards.filter(c=>c.state.overdue).length;

  function onDropCol(stageId) {
    if (!dragCard) return;
    checklist.setStage(dragCard.instanceId, dragCard.report.id, stageId, actor, dragCard.completedAt, dragCard.report.etaHours);
    setDragCard(null); setDragOverCol(null);
  }

  return (
    <div>
      <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:16, flexWrap:'wrap'}}>
        <div style={{display:'flex', alignItems:'center', gap:8, fontSize:13, color:'var(--spira-muted)'}}>
          <b style={{color:'var(--spira-ink)', fontSize:15}}>{cards.length}</b> reportes en curso
          {overdueCount>0 && <span style={{display:'inline-flex', alignItems:'center', gap:5, color:OVERDUE_COLOR, fontWeight:600}}><Icon name="alert" size={13}/>{overdueCount} vencidos</span>}
        </div>
        <div style={{flex:1}}/>
        <select value={visitFilter} onChange={e=>setVisitFilter(e.target.value)} style={{height:36, padding:'0 10px', border:'1px solid var(--spira-line-2)', borderRadius:9, background:'var(--spira-white)', fontSize:13, fontFamily:'inherit'}}>
          <option value="todas">Todas las visitas</option>
          {VISITS.map(v=><option key={v.code} value={v.code}>{v.code} · {v.name}</option>)}
        </select>
        <select value={platFilter} onChange={e=>setPlatFilter(e.target.value)} style={{height:36, padding:'0 10px', border:'1px solid var(--spira-line-2)', borderRadius:9, background:'var(--spira-white)', fontSize:13, fontFamily:'inherit'}}>
          <option value="todas">Todas las plataformas</option>
          {Object.entries(PLATFORMS).map(([id,p])=><option key={id} value={id}>{p.label}</option>)}
        </select>
        <div style={{display:'flex', alignItems:'center', gap:7}}>
          <span style={{fontSize:12, color:'var(--spira-faint)'}}>Actuando como</span>
          <select value={actor} onChange={e=>setActor(e.target.value)} style={{height:36, padding:'0 10px', border:'1px solid var(--spira-line-2)', borderRadius:9, background:'var(--spira-white)', fontSize:13, fontFamily:'inherit'}}>
            {CURRENT_USERS.map(u=><option key={u} value={u}>{u}</option>)}
          </select>
        </div>
      </div>

      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:16}}>
        {STAGES.map(s => {
          const items = cards.filter(c=>c.state.status===s.id);
          return (
            <div key={s.id} className="kCol" onDragOver={(e)=>{e.preventDefault(); setDragOverCol(s.id);}} onDragLeave={()=>setDragOverCol(o=>o===s.id?null:o)} onDrop={()=>onDropCol(s.id)}
              style={{background: dragOverCol===s.id?'rgba(46,125,116,.06)':'var(--spira-surface)', border:'1px solid '+(dragOverCol===s.id?ACCENT:'var(--spira-line)'), borderRadius:14, padding:14, minHeight:220}}>
              <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:12}}>
                <span style={{width:8, height:8, borderRadius:99, background:s.color}}/>
                <span style={{fontWeight:700, fontSize:13.5}}>{s.label}</span>
                <span style={{fontSize:11.5, color:'var(--spira-faint)', fontVariantNumeric:'tabular-nums'}}>{items.length}</span>
              </div>
              <div style={{display:'flex', flexDirection:'column', gap:10}}>
                {items.length===0 && <div style={{fontSize:11.5, color:'var(--spira-faint)', textAlign:'center', padding:'24px 0'}}>Sin reportes acá.</div>}
                {items.map(c => (
                  <KanbanCard key={c.instanceId+c.report.id} card={c} checklist={checklist} actor={actor}
                    onDragStart={()=>setDragCard(c)} onDragEnd={()=>{setDragCard(null); setDragOverCol(null);}} dragging={dragCard && dragCard.instanceId===c.instanceId && dragCard.report.id===c.report.id}
                    onOpenProcedures={()=>setOpenVisit(c.visit.code)}/>
                ))}
              </div>
            </div>
          );
        })}
      </div>

      {closedList.length>0 && (
        <div style={{marginTop:22}}>
          <div style={{display:'flex', alignItems:'center', gap:7, marginBottom:10}}>
            <Icon name="check" size={14} color={ACCENT}/>
            <span className="spira-eyebrow" style={{color:ACCENT}}>Visitas cerradas · alerta finalizada</span>
          </div>
          <div style={{display:'flex', flexDirection:'column', gap:6}}>
            {closedList.map(({inst,patient,visit,at,by}) => (
              <div key={inst.id} style={{display:'flex', alignItems:'center', gap:10, padding:'10px 14px', border:'1px solid var(--spira-line)', borderRadius:10, background:'var(--spira-white)', animation:'closeFlash 1.2s ease'}}>
                <span style={{width:26, height:26, borderRadius:99, background:'rgba(46,125,116,.14)', color:ACCENT, display:'grid', placeItems:'center', flex:'0 0 auto'}}><Icon name="check" size={14} stroke={2.4}/></span>
                <span className="spira-mono" style={{fontSize:11.5, fontWeight:700, color:ACCENT}}>{visit.code}</span>
                <span style={{fontSize:13, fontWeight:600}}>{patient.name}</span>
                <span style={{flex:1}}/>
                <span style={{fontSize:11.5, color:'var(--spira-muted)'}}>Visita realizada · cerrada por {by} · {fmtDT(at)}</span>
              </div>
            ))}
          </div>
        </div>
      )}
      {openVisit && (
        <ProcedureModal visit={VISITS.find(v=>v.code===openVisit)} initial={assign[openVisit] || []} reportDefs={reportDefs}
          onClose={()=>setOpenVisit(null)}
          onSave={(ids)=>{ setAssign(a=>({...a,[openVisit]:ids})); setOpenVisit(null); }}/>
      )}
    </div>
  );
}

/* ================= App ================= */
function App() {
  const [tab, setTab] = useState('reportes');
  const [assign, setAssign] = useState(() => ({...DEFAULT_ASSIGN}));
  const [catalog, setCatalog] = useState(() => PROCS.slice());
  const [reportDefs, setReportDefs] = useState(() => ({...INITIAL_REPORT_DEFS}));
  const TABS = [ {id:'pacientes', label:'Pacientes'}, {id:'cronograma', label:'Cronograma'}, {id:'reportes', label:'Reportes pendientes'} ];

  return (
    <div style={{minHeight:'100vh', padding:'34px 40px 60px'}}>
      <div style={{maxWidth:1220, margin:'0 auto'}}>
        <div style={{fontSize:12.5, color:'var(--spira-muted)', display:'flex', gap:8, alignItems:'center'}}>
          <span>Spira Track</span><Icon name="chevRight" size={13} color="var(--spira-faint)"/><span>Protocolos</span><Icon name="chevRight" size={13} color="var(--spira-faint)"/><span className="spira-mono" style={{color:'var(--spira-ink)'}}>{PROTOCOL_CODE}</span>
        </div>
        <h1 className="spira-h1" style={{fontSize:30, margin:'6px 0 20px'}}>{PROTOCOL_CODE}</h1>
        <div style={{background:'var(--spira-white)', border:'1px solid var(--spira-line)', borderRadius:16, boxShadow:'var(--spira-shadow-sm)', padding:'20px 22px 22px'}}>
          <div style={{display:'flex', gap:6, background:'var(--spira-paper)', padding:4, borderRadius:11, marginBottom:20, width:'fit-content'}}>
            {TABS.map(t => (
              <button key={t.id} className="tabBtn" onClick={()=>setTab(t.id)}
                style={{height:32, padding:'0 15px', border:'none', borderRadius:8, background: tab===t.id?'var(--spira-white)':'transparent', color: tab===t.id?'var(--spira-ink)':'var(--spira-muted)', fontWeight: tab===t.id?700:600, fontSize:13.5, cursor:'pointer', boxShadow: tab===t.id?'var(--spira-shadow-sm)':'none'}}>{t.label}</button>
            ))}
          </div>
          {tab==='pacientes' && <div style={{padding:'30px 0', textAlign:'center', color:'var(--spira-faint)', fontSize:13}}>Prototipo enfocado en Cronograma y Reportes pendientes.</div>}
          {tab==='cronograma' && <CronogramaSection assign={assign} setAssign={setAssign} catalog={catalog} setCatalog={setCatalog} reportDefs={reportDefs} setReportDefs={setReportDefs}/>}
          {tab==='reportes' && <ReportesPendientesTab reportDefs={reportDefs} assign={assign} setAssign={setAssign}/>}
        </div>
        <p style={{fontSize:12, color:'var(--spira-faint)', marginTop:16, textAlign:'center'}}>Prototipo · fechas simuladas respecto de hoy (20/08/2026) · arrastrá las tarjetas o usá el botón para avanzar de etapa.</p>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
