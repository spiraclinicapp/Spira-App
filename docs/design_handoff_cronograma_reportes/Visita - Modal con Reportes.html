<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visita · Modal con reportes</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--spira-paper);font-family:var(--spira-font-text);color:var(--spira-ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
input{font-family:inherit}
.xbtn{transition:background .14s ease,border-color .14s ease}
.xbtn:hover{background:var(--spira-surface)}
.chk{transition:background .14s ease,border-color .14s ease}
.linkBtn{transition:filter .13s ease}
.linkBtn:hover{filter:brightness(.95)}
.advBtn{transition:filter .13s ease}
.advBtn:hover{filter:brightness(.94)}
.bgList{position:fixed;inset:0;padding:40px;color:var(--spira-faint);font-size:13px;z-index:-1}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" data-presets="react">
const { useState } = React;
const ACCENT = 'var(--spira-track)', ACCENT_SOLID = 'var(--spira-primary)', DOWNLOAD_COLOR = '#3A6B8C', OVERDUE = '#A6483B';
const PLATFORMS = { clario:{label:'Clario', color:'#B0823F', url:'https://ecoa.clario.com/act18301'} };
const STAGES = [ {id:'pendiente',label:'Pendiente',icon:'clock',color:'var(--spira-muted)'}, {id:'descargado',label:'Descargado',icon:'download',color:DOWNLOAD_COLOR}, {id:'evolucionado',label:'Evolucionado',icon:'check',color:ACCENT_SOLID} ];

function Icon({ name, size=16, color='currentColor', stroke=1.8 }) {
  const P = {
    chevUp: <path d="m18 15-6-6-6 6"/>,
    chevDown: <path d="m6 9 6 6 6-6"/>,
    x: <><path d="M18 6 6 18"/><path d="m6 6 12 12"/></>,
    calendar: <><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></>,
    lock: <><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></>,
    check: <path d="M20 6 9 17l-5-5"/>,
    clip: <><path d="m16 6-8.5 8.5a2.12 2.12 0 0 0 3 3L20 8a4.24 4.24 0 0 0-6-6l-9.5 9.5a6.36 6.36 0 0 0 9 9L21 12"/></>,
    chat: <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>,
    plus: <><path d="M5 12h14"/><path d="M12 5v14"/></>,
    alert: <><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></>,
    clock: <><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></>,
    download: <><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></>,
    extLink: <><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></>,
    undo: <><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></>,
    list: <><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></>,
  }[name];
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round">{P}</svg>;
}
const eyebrow = { fontSize:10.5, fontWeight:700, letterSpacing:'.05em', textTransform:'uppercase', color:'var(--spira-faint)' };
const cardShell = { background:'var(--spira-white)', border:'1px solid var(--spira-line)', borderRadius:12, overflow:'hidden' };

/* Reporte de "Espirometría": único procedimiento del ejemplo, con un reporte en Clario. */
const REPORT = { id:'r4', name:'Curva flujo-volumen', platform:'clario', link:PLATFORMS.clario.url, etaHours:2, notes:'Cargar antes de que el paciente se retire del centro.' };
const COMPLETED_AT = new Date('2026-08-18T21:40:00-03:00');

function ReportLine({ report, dueAt }) {
  const [stage, setStage] = useState('pendiente');
  const [history, setHistory] = useState([{ stage:'pendiente', by:'Sistema', at: COMPLETED_AT }]);
  const [showHist, setShowHist] = useState(false);
  const idx = STAGES.findIndex(s=>s.id===stage);
  const next = STAGES[idx+1];
  const plat = PLATFORMS[report.platform];
  const overdue = stage==='pendiente' && new Date('2026-08-20T15:30:00-03:00') > dueAt;
  function fmt(d){ return d.toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }
  function go(delta){
    const ni = idx+delta; if (ni<0 || ni>=STAGES.length) return;
    const s = STAGES[ni].id; setStage(s); setHistory(h=>[...h, { stage:s, by:'Vos', at:new Date('2026-08-20T15:30:00-03:00') }]);
  }
  return (
    <div style={{marginTop:8, marginLeft:30, padding:'10px 12px', background:'var(--spira-surface)', border:'1px solid var(--spira-line)', borderRadius:10, display:'flex', flexDirection:'column', gap:8}}>
      <div style={{display:'flex', alignItems:'center', gap:8}}>
        <div style={{flex:1, minWidth:0}}>
          <div style={{fontSize:12.5, fontWeight:600}}>{report.name}</div>
          {report.notes && <div style={{fontSize:11, color:'var(--spira-faint)', marginTop:1}}>{report.notes}</div>}
        </div>
        <a className="linkBtn" href={plat.url} target="_blank" rel="noreferrer" style={{display:'inline-flex', alignItems:'center', gap:6, height:26, padding:'0 10px', borderRadius:8, background:plat.color+'1c', color:plat.color, fontSize:11, fontWeight:700, textDecoration:'none', flex:'0 0 auto'}}>
          Abrir en {plat.label}<Icon name="extLink" size={11} stroke={2.2}/>
        </a>
      </div>
      <div style={{fontSize:11, fontWeight:600, color: overdue?OVERDUE:'var(--spira-muted)'}}>
        {stage==='evolucionado' ? 'Evolucionado '+fmt(history[history.length-1].at)
          : stage==='descargado' ? 'Descargado '+fmt(history[history.length-1].at)
          : (overdue ? 'Vencido hace un rato' : 'Vence en ~'+report.etaHours+' h')}
      </div>
      <div style={{display:'flex', alignItems:'center', gap:6}}>
        {next ? (
          <button className="advBtn" onClick={()=>go(1)} style={{flex:1, height:28, border:'none', borderRadius:8, background:next.color, color:'var(--spira-on-accent)', fontSize:11.5, fontWeight:700, cursor:'pointer', display:'inline-flex', alignItems:'center', justifyContent:'center', gap:6}}>
            <Icon name={next.icon} size={12} stroke={2.4}/>Marcar {next.label.toLowerCase()}
          </button>
        ) : (
          <span style={{flex:1, height:28, display:'inline-flex', alignItems:'center', justifyContent:'center', gap:6, fontSize:11.5, fontWeight:700, color:ACCENT}}><Icon name="check" size={13}/>Evolucionado</span>
        )}
        <button className="xbtn" onClick={()=>go(-1)} title="Retroceder etapa" style={{width:28, height:28, border:'1px solid var(--spira-line-2)', borderRadius:8, background:'var(--spira-white)', cursor:'pointer', display:'grid', placeItems:'center'}}><Icon name="undo" size={12} color="var(--spira-muted)"/></button>
      </div>
      <button onClick={()=>setShowHist(h=>!h)} style={{display:'inline-flex', alignItems:'center', gap:5, border:'none', background:'transparent', color:'var(--spira-faint)', fontSize:10.5, cursor:'pointer', padding:0, alignSelf:'flex-start'}}>
        <Icon name="list" size={11}/>Historial ({history.length})<Icon name="chevDown" size={10} stroke={2}/>
      </button>
      {showHist && (
        <div style={{display:'flex', flexDirection:'column', gap:3, borderTop:'1px solid var(--spira-line)', paddingTop:6}}>
          {history.map((h,i)=>(
            <div key={i} style={{fontSize:10.5, color:'var(--spira-muted)', display:'flex', gap:5}}>
              <span className="spira-mono" style={{color:'var(--spira-faint)'}}>{fmt(h.at)}</span>
              <span>{STAGES.find(s=>s.id===h.stage).label} · {h.by}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ProcedimientosCard(){
  const [done, setDone] = useState(false);
  const [open, setOpen] = useState(false);
  const dueAt = new Date(COMPLETED_AT.getTime() + REPORT.etaHours*3600e3);
  return (
    <div style={cardShell}>
      <div style={{display:'flex', alignItems:'center', gap:8, padding:'12px 14px', borderBottom:'1px solid var(--spira-line)'}}>
        <Icon name="clip" size={15} color={ACCENT}/>
        <span style={{fontWeight:700, fontSize:14}}>Procedimientos</span>
        <span style={{flex:1}}/>
        <span style={{fontSize:11.5, color:'var(--spira-faint)', fontWeight:600}}>{done?1:0}/1 realizados</span>
      </div>
      <div style={{padding:12}}>
        <div style={{display:'flex', alignItems:'center', gap:10, padding:'8px 6px'}}>
          <button className="chk" onClick={()=>setDone(d=>!d)} title="Marcar realizado — activa el plazo del reporte" style={{width:20, height:20, flex:'0 0 auto', borderRadius:6, border:'1.5px solid '+(done?ACCENT:'var(--spira-line-2)'), background:done?ACCENT_SOLID:'var(--spira-white)', display:'grid', placeItems:'center', cursor:'pointer'}}>
            {done && <Icon name="check" size={12} color="var(--spira-on-accent)" stroke={2.8}/>}
          </button>
          <div style={{flex:1, minWidth:0}}>
            <div style={{fontSize:13.5, fontWeight:600}}>Espirometría</div>
            <div style={{fontSize:11.5, color:'var(--spira-faint)', marginTop:1}}>Cardio-respiratorio</div>
          </div>
          <button onClick={()=>setOpen(o=>!o)} style={{display:'inline-flex', alignItems:'center', gap:5, height:24, padding:'0 8px', border:'1px solid var(--spira-line-2)', borderRadius:99, background:'var(--spira-white)', cursor:'pointer'}}>
            <span style={{fontSize:11, fontWeight:600, color:'var(--spira-muted)'}}>1 reporte</span>
            <Icon name="chevDown" size={11} stroke={2.2} style={{transform:open?'rotate(180deg)':'none'}}/>
          </button>
        </div>
        {open && (done
          ? <ReportLine report={REPORT} dueAt={dueAt}/>
          : <div style={{marginLeft:30, marginTop:6, fontSize:11, color:'var(--spira-faint)'}}>Se habilita al marcar el procedimiento como realizado.</div>)}
      </div>
    </div>
  );
}

function VisitModal(){
  return (
    <div style={{position:'fixed', inset:0, background:'rgba(20,48,46,.34)', display:'grid', placeItems:'center', padding:24}}>
      <div className="bgList">3 visitas · 3 finalizadas</div>
      <div style={{width:'min(980px,100%)', maxHeight:'calc(100vh - 48px)', background:'var(--spira-white)', border:'1px solid var(--spira-line)', borderRadius:16, boxShadow:'var(--spira-shadow-lg)', display:'flex', flexDirection:'column', overflow:'hidden'}}>
        {/* header */}
        <div style={{display:'flex', alignItems:'center', gap:10, padding:'14px 20px', borderBottom:'1px solid var(--spira-line)'}}>
          <span style={{fontWeight:800, fontSize:13.5, letterSpacing:'.01em'}}>AIRLYMPUS</span>
          <span className="spira-mono" style={{fontSize:12, color:'var(--spira-muted)'}}>ACT18301</span>
          <span style={{display:'inline-flex', alignItems:'center', gap:6, height:26, padding:'0 10px', borderRadius:99, background:'rgba(46,125,116,.12)', color:ACCENT, fontSize:12, fontWeight:700}}><Icon name="calendar" size={12} stroke={2.2}/>Visita V5</span>
          <span style={{flex:1}}/>
          <button className="xbtn" style={{width:28, height:28, border:'1px solid var(--spira-line-2)', borderRadius:8, background:'var(--spira-white)', cursor:'pointer', display:'grid', placeItems:'center'}}><Icon name="chevUp" size={14} color="var(--spira-muted)"/></button>
          <span style={{fontSize:12.5, color:'var(--spira-muted)', fontWeight:600}}>1 / 3</span>
          <button className="xbtn" style={{width:28, height:28, border:'1px solid var(--spira-line-2)', borderRadius:8, background:'var(--spira-white)', cursor:'pointer', display:'grid', placeItems:'center'}}><Icon name="chevDown" size={14} color="var(--spira-muted)"/></button>
          <button className="xbtn" title="Cerrar" style={{width:28, height:28, border:'1px solid var(--spira-line-2)', borderRadius:8, background:'var(--spira-white)', cursor:'pointer', display:'grid', placeItems:'center'}}><Icon name="x" size={15} color="var(--spira-muted)"/></button>
        </div>

        {/* datos del paciente */}
        <div style={{display:'grid', gridTemplateColumns:'1.3fr 1fr 1fr', gap:20, padding:'16px 20px', borderBottom:'1px solid var(--spira-line)'}}>
          <div style={{borderLeft:'3px solid '+ACCENT, paddingLeft:12}}>
            <div style={{fontSize:18, fontWeight:800}}>Magali Lopez</div>
            <div className="spira-mono" style={{fontSize:12.5, color:'var(--spira-muted)', marginTop:1}}>03200070002</div>
            <div style={{...eyebrow, marginTop:10, display:'flex', alignItems:'center', gap:5}}><Icon name="lock" size={10} stroke={2.2}/>Médico a cargo</div>
            <div style={{fontSize:13, fontWeight:700, marginTop:2}}>Federico Razquin</div>
          </div>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:12}}>
            <div><div style={eyebrow}>Sexo</div><div style={{fontSize:13, fontWeight:600, marginTop:3}}>Femenino</div></div>
            <div><div style={eyebrow}>Edad</div><div style={{fontSize:13, fontWeight:600, marginTop:3}}>20 años</div></div>
            <div><div style={eyebrow}>F. Nacimiento</div><div style={{fontSize:13, fontWeight:600, marginTop:3}}>03/06/2006</div></div>
            <div><div style={eyebrow}>Fértil</div><div style={{fontSize:13, fontWeight:600, marginTop:3}}>Fértil</div></div>
          </div>
          <div style={{display:'flex', flexDirection:'column', gap:8}}>
            <div>
              <div style={eyebrow}>Fecha est.</div>
              <div style={{display:'flex', alignItems:'center', gap:8, height:32, padding:'0 10px', border:'1px solid var(--spira-line-2)', borderRadius:8, background:'var(--spira-white)', marginTop:3, fontSize:12.5}}>18/08/2026<span style={{flex:1}}/><Icon name="calendar" size={13} color="var(--spira-faint)"/></div>
            </div>
            <div>
              <div style={{display:'flex', alignItems:'center', gap:8}}><span style={eyebrow}>Fecha real</span><span style={{display:'inline-flex', alignItems:'center', gap:4, fontSize:10.5, fontWeight:700, color:OVERDUE, background:OVERDUE+'1c', padding:'1px 7px', borderRadius:99}}><Icon name="alert" size={10} stroke={2.4}/>Fuera de ventana</span></div>
              <div style={{display:'flex', alignItems:'center', gap:8, height:32, padding:'0 10px', border:'1px solid var(--spira-line-2)', borderRadius:8, background:'var(--spira-white)', marginTop:3, fontSize:12.5}}>18/08/2026<span style={{flex:1}}/><Icon name="calendar" size={13} color="var(--spira-faint)"/></div>
            </div>
          </div>
        </div>

        {/* progreso */}
        <div style={{display:'flex', alignItems:'center', gap:16, padding:'12px 20px', borderBottom:'1px solid var(--spira-line)', background:'var(--spira-surface)'}}>
          <div style={{flex:1}}>
            <div style={{fontSize:12.5, fontWeight:600}}>Fin de atención <span style={{color:'var(--spira-muted)', fontWeight:400}}>22:27 · ruta completa</span></div>
            <div style={{height:4, borderRadius:99, background:'var(--spira-line)', marginTop:6, overflow:'hidden'}}><div style={{height:'100%', width:'100%', background:ACCENT_SOLID}}/></div>
          </div>
          <span className="spira-mono" style={{fontSize:11.5, color:'var(--spira-muted)'}}>4 DE 4</span>
          <span style={{display:'inline-flex', alignItems:'center', gap:6, height:30, padding:'0 12px', borderRadius:99, background:'rgba(46,125,116,.14)', color:ACCENT, fontSize:12, fontWeight:700}}><Icon name="check" size={13} stroke={2.6}/>Finalizada 18/08/2026 22:27</span>
        </div>

        {/* cuerpo */}
        <div style={{padding:20, display:'grid', gridTemplateColumns:'1fr 1fr', gap:16}}>
          <ProcedimientosCard/>
          <div style={cardShell}>
            <div style={{display:'flex', alignItems:'center', gap:8, padding:'12px 14px', background:'#14302E'}}>
              <Icon name="clip" size={15} color="#fff"/>
              <span style={{fontWeight:700, fontSize:14, color:'#fff'}}>Dispensación</span>
            </div>
            <div style={{padding:14}}>
              <div style={eyebrow}>Medicación concomitante</div>
              <button style={{width:'100%', height:44, marginTop:8, border:'1.5px dashed var(--spira-line-2)', borderRadius:10, background:'transparent', color:ACCENT, fontWeight:600, fontSize:13, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', gap:6}}><Icon name="plus" size={15}/>Agregar medicación</button>
            </div>
          </div>
          <div style={{...cardShell, gridColumn:'1 / -1'}}>
            <div style={{display:'flex', alignItems:'center', gap:8, padding:'12px 14px', borderBottom:'1px solid var(--spira-line)'}}>
              <Icon name="chat" size={14} color={ACCENT}/>
              <span style={{fontWeight:700, fontSize:14}}>Comentarios</span>
            </div>
            <div style={{padding:'26px 14px', textAlign:'center'}}>
              <Icon name="chat" size={22} color="var(--spira-line-2)"/>
              <div style={{fontSize:13, fontWeight:600, marginTop:8}}>Todavía no hay comentarios.</div>
              <div style={{fontSize:12, color:'var(--spira-faint)', marginTop:2}}>Escribí el primero para el equipo.</div>
            </div>
            <div style={{display:'flex', gap:10, padding:'0 14px 14px', alignItems:'flex-end'}}>
              <div style={{flex:1, minHeight:44, border:'1px solid var(--spira-line-2)', borderRadius:10, background:'var(--spira-white)', padding:'10px 12px', fontSize:12.5, color:'var(--spira-faint)'}}>Escribí un comentario…  (Enter envía · Shift+Enter salta de línea)</div>
              <button disabled style={{height:44, padding:'0 18px', border:'none', borderRadius:10, background:'var(--spira-line)', color:'var(--spira-faint)', fontWeight:600, fontSize:13}}>Enviar</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<VisitModal/>);
</script>
</body>
</html>
