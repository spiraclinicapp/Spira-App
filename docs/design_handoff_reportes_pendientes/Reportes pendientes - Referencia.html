<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reportes pendientes · Referencia de handoff</title>
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="spira-app-tokens.css">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{background:#DCD7C8;font-family:var(--spira-font-text);color:var(--spira-ink)}
button{font-family:inherit}
a{color:var(--spira-primary)}a:hover{color:var(--spira-primary-deep)}
.num{font-variant-numeric:tabular-nums}
.frameLabel{position:absolute;top:-58px;left:0;display:flex;flex-direction:column;gap:2px}
.frameLabel b{font-size:15px;color:#3b372f}.frameLabel span{font-size:12.5px;color:#5d584d}
.hov:hover{background:var(--spira-surface)}
.btn{transition:filter .12s ease}.btn:hover{filter:brightness(.95)}
.pick{transition:box-shadow .14s ease,border-color .14s ease,background .14s ease}
.pick:hover{box-shadow:0 6px 18px rgba(20,48,46,.08)}
</style>
</head>
<body>
<div style="display:flex;gap:60px;align-items:flex-start;padding:90px 40px 60px;width:max-content"><div id="mod" style="width:1120px"></div><div id="wid" style="width:500px"></div></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" data-presets="react">(()=>{
const { useState } = React;
const BLUE='#3A6B8C', RED='var(--spira-danger)', WARN='var(--spira-warn)', GOOD='var(--spira-good)', PRI='var(--spira-primary)';
const ST={sin:{label:'Sin descargar',color:'var(--spira-ink-soft)',bg:'var(--spira-white)',icon:'circle'},desc:{label:'Descargado',color:BLUE,bg:'rgba(58,107,140,.12)',icon:'download'},evo:{label:'Evolucionado',color:GOOD,bg:'rgba(92,138,90,.14)',icon:'check'}};
function Icon({name,size=16,color='currentColor',stroke=1.8}){
  const P={circle:<circle cx="12" cy="12" r="8"/>,download:<><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></>,check:<path d="M20 6 9 17l-5-5"/>,chevDown:<path d="m6 9 6 6 6-6"/>,chevRight:<path d="m9 18 6-6-6-6"/>,search:<><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></>,file:<><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></>,x:<><path d="M6 6l12 12"/><path d="M18 6 6 18"/></>,layers:<><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></>,filter:<path d="M4 5h16l-6 7.5V19l-4 1.5v-8z"/>,clock:<><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></>}[name];
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}>{P}</svg>;
}
const STUDIES=[{id:'ACT18301',name:'AIRLYMPUS'},{id:'CKJX839D12302',name:'VICTORION'},{id:'222714',name:'ENDURA'},{id:'TEST-QA',name:'Protocolo de pruebas (QA)'}];
const R=(id,type,status)=>({id,type,status});
const DATA=[
  {id:1,num:'222714',name:'Maria Julieta Calderon',study:'ACT18301',visit:'V17',date:'18/06',due:107,reports:[R(11,'Espirometría Pre','sin'),R(12,'Espirometría Post','sin'),R(13,'Sangre','desc')]},
  {id:2,num:'222731',name:'Andres Muñoz Pampillon',study:'ACT18301',visit:'V17',date:'06/07',due:89,reports:[R(21,'Espirometría Pre','desc'),R(22,'Espirometría Post','sin')]},
  {id:5,num:'839-0012',name:'Ezequiel Duarte',study:'CKJX839D12302',visit:'V3',date:'12/09',due:21,reports:[R(51,'Resonancia','sin'),R(52,'Sangre','desc'),R(53,'Escala EDSS','sin')]},
  {id:3,num:'222702',name:'Rafael Humberto Gibeaud',study:'ACT18301',visit:'V4 · W8',date:'21/09',due:12,reports:[R(31,'Espirometría Pre','desc'),R(32,'Sangre','sin'),R(33,'ECG','sin')]},
  {id:8,num:'EN-104',name:'Carla Benítez',study:'222714',visit:'V6',date:'24/09',due:4,reports:[R(81,'Ecocardiograma','sin')]},
  {id:6,num:'839-0019',name:'Marisol Herrera',study:'CKJX839D12302',visit:'V5',date:'29/09',due:-2,reports:[R(61,'Sangre','desc'),R(62,'Escala EDSS','desc')]},
  {id:4,num:'222745',name:'Lucía Ferreyra',study:'ACT18301',visit:'V9',date:'30/09',due:-3,reports:[R(41,'ECG','sin'),R(42,'Sangre','desc')]},
  {id:9,num:'QA-001',name:'Paciente Prueba',study:'TEST-QA',visit:'V1',date:'01/10',due:-6,reports:[R(91,'Sangre','sin'),R(92,'ECG','desc')]},
];
const next=s=>s==='sin'?'desc':s==='desc'?'evo':'sin';
const dueLabel=d=>d>0?`Vencido hace ${d} días`:d===0?'Vence hoy':`Vence en ${-d} días`;
const dueColor=d=>d>0?RED:d>=-3?WARN:'var(--spira-ink-soft)';
const counts=p=>p.reports.reduce((a,r)=>(a[r.status]++,a),{sin:0,desc:0,evo:0});
function studyStats(rows,ids){const ps=rows.filter(p=>!ids||!ids.length||ids.includes(p.study));const rs=ps.flatMap(p=>p.reports.map(r=>({...r,od:p.due>0})));
  return {patients:ps.length,sin:rs.filter(r=>r.status==='sin').length,sinOd:rs.filter(r=>r.status==='sin'&&r.od).length,desc:rs.filter(r=>r.status==='desc').length,evo:rs.filter(r=>r.status==='evo').length,venc:ps.filter(p=>p.due>0&&p.reports.some(r=>r.status!=='evo')).length,open:rs.filter(r=>r.status!=='evo').length,total:rs.length};}

function StackBar({s,h=6}){
  const seg=[[s.sinOd,'rgba(166,72,59,.45)'],[s.sin-s.sinOd,'var(--spira-line-2)'],[s.desc,BLUE],[s.evo,GOOD]].filter(x=>x[0]>0);
  return <div style={{display:'flex',gap:2,height:h,borderRadius:99,overflow:'hidden',background:'var(--spira-line)'}}>{seg.map(([n,c],i)=><span key={i} style={{flex:n,background:c}}/>)}</div>;
}
function Legend({s,size=12}){
  return <div style={{display:'flex',gap:10,flexWrap:'wrap',fontSize:size,color:'var(--spira-ink-soft)'}}>
    {s.venc>0&&<span style={{display:'inline-flex',alignItems:'center',gap:5}}><span style={{width:6,height:6,borderRadius:99,background:RED}}/>Vencidos <b className="num" style={{color:'var(--spira-ink)'}}>{s.venc}</b></span>}
    <span style={{display:'inline-flex',alignItems:'center',gap:5}}><span style={{width:6,height:6,borderRadius:99,background:'var(--spira-line-2)'}}/>Sin desc. <b className="num" style={{color:'var(--spira-ink)'}}>{s.sin}</b></span>
    <span style={{display:'inline-flex',alignItems:'center',gap:5}}><span style={{width:6,height:6,borderRadius:99,background:BLUE}}/>Desc. <b className="num" style={{color:'var(--spira-ink)'}}>{s.desc}</b></span>
  </div>;
}

/* ---------- Selector A · Tarjetas ---------- */
function PickerCards({rows,study,setStudy}){
  return <div style={{padding:'16px 26px 4px'}}>
    <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:10}}>
      <span className="spira-eyebrow" style={{color:'var(--spira-ink-soft)'}}>Estudios con pendientes</span>
      <span style={{flex:1,height:1,background:'var(--spira-line-2)'}}/>
      <span style={{fontSize:12.5,color:'var(--spira-ink-soft)'}}>{study.length?<>Mostrando {study.length} de {STUDIES.length} · <a href="#" onClick={e=>{e.preventDefault();setStudy([])}} style={{fontWeight:600}}>Ver todos</a></>:`Mostrando los ${STUDIES.length}`}</span>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(4,minmax(0,1fr))',gap:12}}>
      {STUDIES.map(st=>{const s=studyStats(rows,st.id?[st.id]:[]);const on=st.id?study.includes(st.id):!study.length;const pick=()=>setStudy(!st.id?[]:on?study.filter(x=>x!==st.id):[...study,st.id]);const dim=study.length>0&&!on;
        return <button key={st.id} className="pick" onClick={pick} style={{textAlign:'left',cursor:'pointer',padding:'14px 16px 12px',borderRadius:14,border:on?`1.5px solid ${PRI}`:'1px solid var(--spira-line)',background:on?'rgba(15,95,87,.07)':'var(--spira-white)',opacity:dim?.62:1,display:'flex',flexDirection:'column',gap:10,minWidth:0}}>
          <div style={{minWidth:0}}>
            <div style={{fontFamily:'var(--spira-font-display)',fontWeight:700,fontSize:17,color:PRI,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{st.id}</div>
            <div style={{fontSize:12.5,fontWeight:600,color:'var(--spira-ink-2)',marginTop:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{st.name}</div>
          </div>
          <div style={{display:'flex',alignItems:'baseline',gap:6}}><span className="num" style={{fontFamily:'var(--spira-font-display)',fontWeight:700,fontSize:26,lineHeight:1,color:s.venc?RED:'var(--spira-ink)'}}>{s.open}</span><span style={{fontSize:12.5,color:'var(--spira-ink-soft)'}}>{s.open===1?'pendiente':'pendientes'} · {s.patients} pac.</span></div>
          <StackBar s={s}/>
          <Legend s={s} size={11.5}/>
          <div style={{fontSize:12,fontWeight:600,color:on?PRI:'var(--spira-ink-soft)',textAlign:'right',display:'flex',justifyContent:'flex-end',alignItems:'center',gap:5}}>{on?<><Icon name="check" size={13} stroke={2.4}/>Enfocado</>:study.length?'+ Sumar':'Ver sólo este'}</div>
        </button>;})}
    </div>
  </div>;
}

function Dropdown({icon,label,options,value,setValue,openId,setOpenId,id}){
  const n=value.length;const on=n>0;const isOpen=openId===id;
  const toggle=v=>setValue(value.includes(v)?value.filter(x=>x!==v):[...value,v]);
  return <div style={{position:'relative'}}>
    <button className="btn" onClick={()=>setOpenId(isOpen?null:id)} style={{display:'inline-flex',alignItems:'center',gap:8,height:38,padding:'0 12px 0 13px',borderRadius:10,cursor:'pointer',fontSize:14,fontWeight:600,border:on?`1px solid ${PRI}`:'1px solid var(--spira-line-2)',background:on?'rgba(15,95,87,.10)':'var(--spira-white)',color:on?PRI:'var(--spira-ink)'}}>
      <Icon name={icon} size={15} color={on?PRI:'var(--spira-ink-soft)'}/>{label}
      {on&&<span className="num" style={{minWidth:20,height:20,padding:'0 6px',borderRadius:99,display:'grid',placeItems:'center',fontSize:11.5,fontWeight:700,background:PRI,color:'var(--spira-on-accent)'}}>{n}</span>}
      <Icon name="chevDown" size={15} color={on?PRI:'var(--spira-ink-soft)'}/>
    </button>
    {isOpen&&<><div onClick={()=>setOpenId(null)} style={{position:'fixed',inset:0,zIndex:5}}/>
      <div style={{position:'absolute',top:44,left:0,zIndex:6,minWidth:240,padding:6,background:'var(--spira-white)',border:'1px solid var(--spira-line)',borderRadius:12,boxShadow:'var(--spira-shadow-md)'}}>
        {options.map(([v,l,c])=>{const sel=value.includes(v);return <button key={v} className="hov" onClick={()=>toggle(v)} style={{display:'flex',alignItems:'center',gap:10,width:'100%',padding:'9px 10px',border:'none',borderRadius:8,background:'transparent',cursor:'pointer',fontSize:13,color:'var(--spira-ink)',textAlign:'left'}}>
          <span style={{width:16,height:16,borderRadius:4,display:'grid',placeItems:'center',border:sel?'none':'1.5px solid var(--spira-line-2)',background:sel?PRI:'var(--spira-white)',color:'var(--spira-on-accent)'}}>{sel&&<Icon name="check" size={11} stroke={3}/>}</span>
          <span style={{flex:1}}>{l}</span><span className="num" style={{fontSize:12,color:'var(--spira-ink-soft)'}}>{c}</span>
        </button>;})}
      </div></>}
  </div>;
}

/* ---------- Módulo (A definitivo) con selector ---------- */
function SegBar({reports,overdue}){
  return <div style={{display:'flex',gap:3,width:120}}>{reports.map(r=><span key={r.id} title={`${r.type}: ${ST[r.status].label}`} style={{flex:1,height:8,borderRadius:3,background:r.status==='sin'?(overdue?'rgba(166,72,59,.28)':'var(--spira-line)'):r.status==='desc'?BLUE:GOOD}}/>)}</div>;
}
function StatusChip({status,overdue,onClick}){const s=ST[status];const red=status==='sin'&&overdue;
  return <button className="btn" onClick={onClick} style={{display:'inline-flex',alignItems:'center',gap:6,height:24,padding:'0 9px',borderRadius:99,cursor:'pointer',fontSize:11.5,fontWeight:600,color:red?RED:s.color,background:red?'rgba(166,72,59,.08)':s.bg,border:status==='sin'?`1px dashed ${red?'rgba(166,72,59,.55)':'var(--spira-line-2)'}`:'1px solid transparent',whiteSpace:'nowrap'}}><Icon name={s.icon} size={12} stroke={2.2}/>{s.label}</button>;}
function ActionBtn({status,onSet}){
  if(status==='sin') return <button className="btn" onClick={()=>onSet('desc')} style={{height:30,padding:'0 12px',borderRadius:8,border:`1px solid ${BLUE}`,background:'var(--spira-white)',color:BLUE,fontWeight:600,fontSize:12.5,cursor:'pointer',display:'inline-flex',alignItems:'center',gap:6}}><Icon name="download" size={14}/>Descargar</button>;
  if(status==='desc') return <button className="btn" onClick={()=>onSet('evo')} style={{height:30,padding:'0 12px',borderRadius:8,border:'none',background:PRI,color:'var(--spira-on-accent)',fontWeight:600,fontSize:12.5,cursor:'pointer',display:'inline-flex',alignItems:'center',gap:6}}><Icon name="check" size={14}/>Evolucionar</button>;
  return <button onClick={()=>onSet('desc')} style={{height:30,padding:'0 8px',border:'none',background:'none',color:'var(--spira-ink-soft)',fontSize:12.5,cursor:'pointer',textDecoration:'underline'}}>Deshacer</button>;
}

function Module({Picker,side}){
  const [rows,setRows]=useState(DATA);
  const setStatus=(pid,rid,status)=>setRows(rs=>rs.map(p=>p.id!==pid?p:{...p,reports:p.reports.map(r=>r.id===rid?{...r,status}:r)}));
  const [study,setStudy]=useState(['ACT18301']);const [est,setEst]=useState([]);const [ant,setAnt]=useState([]);const [tipo,setTipo]=useState([]);const [menu,setMenu]=useState(null);const [q,setQ]=useState('');const [open,setOpen]=useState({1:true});
  const scoped=rows.filter(p=>!study.length||study.includes(p.study));
  const list=scoped.filter(p=>{
    if(q&&!(p.name.toLowerCase().includes(q.toLowerCase())||p.num.toLowerCase().includes(q.toLowerCase())))return false;
    if(est.length&&!p.reports.some(r=>est.includes(r.status)))return false;
    if(tipo.length&&!p.reports.some(r=>r.status!=='evo'&&tipo.includes(r.type)))return false;
    const a=p.due>0?'venc':p.due>=-7?'sem':'mas';
    if(ant.length&&!ant.includes(a))return false;
    return true;});
  const s=studyStats(rows,study);
  const types=[...new Set(scoped.flatMap(p=>p.reports.map(r=>r.type)))];
  const nActive=est.length+ant.length+tipo.length;
  const clear=()=>{setEst([]);setAnt([]);setTipo([]);};
  const pend=scoped.flatMap(p=>p.reports).filter(r=>r.status!=='evo').length;
  const listPend=list.flatMap(p=>p.reports).filter(r=>r.status!=='evo').length;
  const showStudy=study.length!==1;
  const cols=showStudy?'28px 96px minmax(0,1fr) 150px 230px 160px':'28px 96px minmax(0,1fr) 80px 230px 160px';

  const header=<div style={{padding:'22px 26px 0'}}>
    <div style={{fontSize:12.5,color:'var(--spira-ink-soft)',marginBottom:4}}>Spira Coordinación <span style={{margin:'0 6px',color:'var(--spira-faint)'}}>›</span><b style={{color:'var(--spira-ink)'}}>Reportes pendientes</b></div>
    <div className="spira-h2" style={{fontSize:26}}>Reportes pendientes</div>
  </div>;
  const dd={openId:menu,setOpenId:setMenu};
  const toolbar=<div style={{padding:side?'0 0 12px':'18px 26px 12px'}}><div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
    <Dropdown {...dd} id="est" icon="filter" label="Estado" value={est} setValue={setEst} options={[['sin','Sin descargar',s.sin],['desc','Descargado, sin evolucionar',s.desc]]}/>
    <Dropdown {...dd} id="tipo" icon="file" label="Informe" value={tipo} setValue={setTipo} options={types.map(t=>[t,t,scoped.flatMap(p=>p.reports).filter(r=>r.type===t&&r.status!=='evo').length])}/>
    <span style={{width:1,height:24,background:'var(--spira-line-2)',margin:'0 4px'}}/>
    <Dropdown {...dd} id="ant" icon="clock" label="Antigüedad" value={ant} setValue={setAnt} options={[['venc','Vencidos',scoped.filter(p=>p.due>0).length],['sem','Vencen en 7 días',scoped.filter(p=>p.due<=0&&p.due>=-7).length],['mas','Más adelante',scoped.filter(p=>p.due<-7).length]]}/>
    <div style={{flex:1}}/>
    <label style={{display:'flex',alignItems:'center',gap:8,height:38,width:side?200:240,padding:'0 12px',borderRadius:10,border:'1px solid var(--spira-line-2)',background:'var(--spira-white)'}}><Icon name="search" size={15} color="var(--spira-muted)"/><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Paciente o número…" style={{border:'none',outline:'none',flex:1,minWidth:0,fontSize:13,fontFamily:'inherit',background:'transparent',color:'var(--spira-ink)'}}/></label>
  </div>
  <div style={{display:'flex',alignItems:'center',gap:12,marginTop:10,fontSize:12.5,color:'var(--spira-ink-soft)'}}>
    <span className="num">{nActive?`${listPend} de ${pend} pendientes`:`${pend} pendientes`} · {list.length} {list.length===1?'paciente':'pacientes'}</span>
    {nActive>0&&<button onClick={clear} style={{display:'inline-flex',alignItems:'center',gap:4,border:'none',background:'none',padding:0,cursor:'pointer',fontSize:12.5,fontWeight:600,color:'var(--spira-ink-2)'}}><Icon name="x" size={12}/>Limpiar {nActive}</button>}
  </div></div>;
  const table=<div style={{background:'var(--spira-white)',border:'1px solid var(--spira-line)',borderRadius:14,overflow:'hidden'}}>
        <div style={{display:'grid',gridTemplateColumns:cols,gap:12,padding:'10px 18px',fontSize:11,fontWeight:700,letterSpacing:'.04em',textTransform:'uppercase',color:'var(--spira-ink-soft)',background:'var(--spira-surface)'}}><span/><span>N° paciente</span><span>Paciente</span><span>{showStudy?'Estudio · Visita':'Visita'}</span><span>Estado de reportes</span><span style={{textAlign:'right'}}>Plazo</span></div>
    {list.map(p=>{const c=counts(p);const isOpen=!!open[p.id];const od=p.due>0;
      return <div key={p.id} style={{borderTop:'1px solid var(--spira-line)'}}>
        <div className="hov" onClick={()=>setOpen(o=>({...o,[p.id]:!o[p.id]}))} style={{display:'grid',gridTemplateColumns:cols,gap:12,alignItems:'center',padding:'14px 18px',cursor:'pointer',background:isOpen?'var(--spira-surface)':undefined}}>
          <Icon name={isOpen?'chevDown':'chevRight'} size={16} color="var(--spira-ink-soft)"/>
          <span className="num" style={{fontSize:15,fontWeight:700,fontFamily:'var(--spira-font-display)'}}>{p.num}</span>
          <span style={{fontSize:14,fontWeight:600,color:'var(--spira-ink-2)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.name}</span>
          <span style={{fontSize:13,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{showStudy?<><b style={{fontWeight:600}}>{p.study}</b><span style={{color:'var(--spira-ink-soft)'}}> · {p.visit}</span></>:p.visit}</span>
          <div style={{display:'flex',alignItems:'center',gap:12}}><SegBar reports={p.reports} overdue={od}/><span style={{fontSize:12,whiteSpace:'nowrap'}}>{c.sin>0&&<b style={{color:od?RED:'var(--spira-ink)'}}>{c.sin} sin desc.</b>}{c.sin>0&&c.desc>0&&' · '}{c.desc>0&&<b style={{color:BLUE}}>{c.desc} desc.</b>}{c.sin===0&&c.desc===0&&<b style={{color:GOOD}}>Todo evolucionado</b>}</span></div>
          <span style={{fontSize:12.5,fontWeight:od?700:500,textAlign:'right',color:dueColor(p.due)}}>{dueLabel(p.due)}</span>
        </div>
        {isOpen&&<div style={{padding:'4px 18px 14px 58px',background:'var(--spira-surface)'}}>
          {p.reports.map(r=><div key={r.id} style={{display:'grid',gridTemplateColumns:'minmax(0,1fr) 150px 130px',alignItems:'center',gap:12,padding:'9px 14px',marginTop:6,background:'var(--spira-white)',border:'1px solid var(--spira-line)',borderRadius:10}}>
            <span style={{display:'flex',alignItems:'center',gap:10,fontSize:13.5,fontWeight:600,minWidth:0}}><Icon name="file" size={15} color="var(--spira-muted)"/><span>{`Informe ${r.type}`}</span><span style={{fontWeight:400,fontSize:12,color:'var(--spira-ink-soft)'}}>· visita del {p.date}</span></span>
            <StatusChip status={r.status} overdue={od} onClick={()=>setStatus(p.id,r.id,next(r.status))}/>
            <div style={{textAlign:'right'}}><ActionBtn status={r.status} onSet={x=>setStatus(p.id,r.id,x)}/></div>
          </div>)}
        </div>}
      </div>;})}
    {!list.length&&<div style={{padding:24,fontSize:13,color:'var(--spira-ink-soft)',borderTop:'1px solid var(--spira-line)'}}>Sin pacientes para este filtro.</div>}
  </div>;

  return <div style={{background:'var(--spira-paper)',border:'1px solid var(--spira-line)',borderRadius:16,overflow:'hidden',boxShadow:'var(--spira-shadow-md)',paddingBottom:26}}>
    {header}
    {side
      ?<div style={{display:'grid',gridTemplateColumns:'240px minmax(0,1fr)',gap:20,padding:'18px 26px 0'}}>
        <Picker rows={rows} study={study} setStudy={setStudy}/>
        <div style={{minWidth:0}}>{toolbar}{table}</div>
      </div>
      :<><Picker rows={rows} study={study} setStudy={setStudy}/>{toolbar}<div style={{padding:'0 26px'}}>{table}</div></>}
  </div>;
}

const mount=(id,t,s,el)=>ReactDOM.createRoot(document.getElementById(id)).render(<div style={{position:'relative'}}><div className="frameLabel"><b>{t}</b><span>{s}</span></div>{el}</div>);
mount('mod','Submódulo · Coordinación › Reportes pendientes','Selector de estudios (tarjetas, multi-selección) + filtros desplegables + tabla por paciente.',<Module Picker={PickerCards}/>);
})();</script>
<script type="text/babel" data-presets="react">(()=>{
const { useState } = React;
const BLUE='#3A6B8C', RED='var(--spira-danger)', WARN='var(--spira-warn)', GOOD='var(--spira-good)';
const ST={sin:{label:'Sin descargar',color:'var(--spira-ink-soft)',bg:'var(--spira-white)',icon:'circle'},desc:{label:'Descargado',color:BLUE,bg:'rgba(58,107,140,.12)',icon:'download'},evo:{label:'Evolucionado',color:GOOD,bg:'rgba(92,138,90,.14)',icon:'check'}};
function Icon({name,size=16,color='currentColor',stroke=1.8}){
  const P={circle:<circle cx="12" cy="12" r="8"/>,download:<><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></>,check:<path d="M20 6 9 17l-5-5"/>,chevDown:<path d="m6 9 6 6 6-6"/>,chevRight:<path d="m9 18 6-6-6-6"/>,file:<><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></>,arrow:<><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></>}[name];
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}>{P}</svg>;
}
const R=(id,type,status)=>({id,type,status});
const DATA=[
  {id:1,num:'222714',name:'Maria Julieta Calderon',study:'ACT18301',visit:'V17',due:107,reports:[R(11,'Espirometría Pre','sin'),R(12,'Espirometría Post','sin'),R(13,'Sangre','desc')]},
  {id:2,num:'222731',name:'Andres Muñoz Pampillon',study:'ACT18301',visit:'V17',due:89,reports:[R(21,'Espirometría Pre','desc'),R(22,'Espirometría Post','sin')]},
  {id:5,num:'839-0012',name:'Ezequiel Duarte',study:'CKJX839D12302',visit:'V3',due:21,reports:[R(51,'Resonancia','sin'),R(52,'Sangre','desc'),R(53,'Escala EDSS','sin')]},
  {id:3,num:'222702',name:'Rafael Humberto Gibeaud',study:'ACT18301',visit:'V4 · W8',due:12,reports:[R(31,'Espirometría Pre','desc'),R(32,'Sangre','sin'),R(33,'ECG','sin')]},
  {id:6,num:'839-0019',name:'Marisol Herrera',study:'CKJX839D12302',visit:'V5',due:-2,reports:[R(61,'Sangre','desc'),R(62,'Escala EDSS','desc')]},
  {id:4,num:'222745',name:'Lucía Ferreyra',study:'ACT18301',visit:'V9',due:-3,reports:[R(41,'ECG','sin'),R(42,'Sangre','desc')]},
];
const TOTAL_PATIENTS=7;
function useData(){const [rows,setRows]=useState(DATA);const setStatus=(pid,rid,status)=>setRows(rs=>rs.map(p=>p.id!==pid?p:{...p,reports:p.reports.map(r=>r.id===rid?{...r,status}:r)}));return [rows,setStatus];}
const next=s=>s==='sin'?'desc':s==='desc'?'evo':'sin';
const dueShort=d=>d>0?`Vencido hace ${d} d`:d===0?'Vence hoy':`Vence en ${-d} d`;
const dueColor=d=>d>0?RED:d>=-3?WARN:'var(--spira-ink-soft)';
const counts=p=>p.reports.reduce((a,r)=>(a[r.status]++,a),{sin:0,desc:0,evo:0});

function SegBar({reports,overdue,w=72}){
  return <div style={{display:'flex',gap:3,width:w}}>{reports.map(r=><span key={r.id} title={`${r.type}: ${ST[r.status].label}`} style={{flex:1,height:7,borderRadius:3,background:r.status==='sin'?(overdue?'rgba(166,72,59,.28)':'var(--spira-line)'):r.status==='desc'?BLUE:GOOD}}/>)}</div>;
}
function Counts({p}){const c=counts(p);const od=p.due>0;
  return <span style={{fontSize:12,whiteSpace:'nowrap'}}>{c.sin>0&&<b style={{color:od?RED:'var(--spira-ink)'}}>{c.sin} sin desc.</b>}{c.sin>0&&c.desc>0&&<span style={{color:'var(--spira-faint)'}}> · </span>}{c.desc>0&&<b style={{color:BLUE}}>{c.desc} desc.</b>}{c.sin===0&&c.desc===0&&<b style={{color:GOOD}}>Listo</b>}</span>;}
function MiniAction({status,onSet}){
  if(status==='sin') return <button className="btn" onClick={()=>onSet('desc')} title="Marcar descargado" style={{height:26,padding:'0 9px',borderRadius:7,border:`1px solid ${BLUE}`,background:'var(--spira-white)',color:BLUE,fontWeight:600,fontSize:12,cursor:'pointer',display:'inline-flex',alignItems:'center',gap:5}}><Icon name="download" size={13}/>Descargar</button>;
  if(status==='desc') return <button className="btn" onClick={()=>onSet('evo')} style={{height:26,padding:'0 9px',borderRadius:7,border:'none',background:'var(--spira-primary)',color:'var(--spira-on-accent)',fontWeight:600,fontSize:12,cursor:'pointer',display:'inline-flex',alignItems:'center',gap:5}}><Icon name="check" size={13}/>Evolucionar</button>;
  return <button onClick={()=>onSet('desc')} style={{height:26,padding:'0 6px',border:'none',background:'none',color:'var(--spira-ink-soft)',fontSize:12,cursor:'pointer',textDecoration:'underline'}}>Deshacer</button>;
}
function StateTag({status,overdue}){const s=ST[status];const red=status==='sin'&&overdue;
  return <span style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:12,fontWeight:600,color:red?RED:s.color,whiteSpace:'nowrap'}}><Icon name={s.icon} size={12} stroke={2.3}/>{s.label}</span>;}

function Card({children}){return <div style={{background:'var(--spira-white)',border:'1px solid var(--spira-line)',borderRadius:16,boxShadow:'var(--spira-shadow-sm)',overflow:'hidden'}}>{children}</div>;}
function Head({rows}){
  return <div style={{display:'flex',alignItems:'center',gap:10,padding:'18px 20px 12px'}}>
    <Icon name="file" size={18} color="var(--spira-ink)"/>
    <span className="spira-h3" style={{fontSize:16.5}}>Reportes pendientes</span>
    <div style={{flex:1}}/>
    <div style={{width:96,height:5,borderRadius:99,background:'var(--spira-line)',overflow:'hidden'}}><div style={{width:'96.2%',height:'100%',background:'var(--spira-primary)'}}/></div>
    <span className="num" style={{fontSize:12.5,color:'var(--spira-ink-soft)'}}>664 de 690</span>
  </div>;
}
function Foot(){return <a href="#" onClick={e=>e.preventDefault()} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 20px',borderTop:'1px solid var(--spira-line)',fontSize:13,fontWeight:600,textDecoration:'none'}}><span>{`Ver los ${TOTAL_PATIENTS} pacientes en Reportes pendientes`}</span><Icon name="arrow" size={15}/></a>;}

/* W1 · Acordeón, se actúa desde el widget */
function W1(){
  const [rows,setStatus]=useData();const [open,setOpen]=useState({1:true});
  return <Card><Head rows={rows}/>
    {rows.slice(0,5).map(p=>{const od=p.due>0;const isOpen=open[p.id];
      return <div key={p.id} style={{borderTop:'1px solid var(--spira-line)'}}>
        <div className="hov" onClick={()=>setOpen(o=>({...o,[p.id]:!o[p.id]}))} style={{display:'grid',gridTemplateColumns:'16px minmax(0,1fr) auto',gap:10,alignItems:'center',padding:'11px 20px',cursor:'pointer',background:isOpen?'var(--spira-surface)':undefined}}>
          <Icon name={isOpen?'chevDown':'chevRight'} size={15} color="var(--spira-ink-soft)"/>
          <div style={{minWidth:0}}>
            <div style={{display:'flex',alignItems:'baseline',gap:8,minWidth:0}}>
              <span className="num" style={{fontSize:14,fontWeight:700,fontFamily:'var(--spira-font-display)'}}>{p.num}</span>
              <span style={{fontSize:13.5,fontWeight:600,color:'var(--spira-ink-2)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.name}</span>
            </div>
            <div style={{fontSize:12,color:'var(--spira-ink-soft)',marginTop:2}}>{p.study} · {p.visit} · <span style={{color:dueColor(p.due),fontWeight:od?700:500}}>{dueShort(p.due)}</span></div>
          </div>
          <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:5}}><SegBar reports={p.reports} overdue={od}/><Counts p={p}/></div>
        </div>
        {isOpen&&<div style={{padding:'0 20px 10px 46px',background:'var(--spira-surface)'}}>
          {p.reports.map(r=><div key={r.id} style={{display:'grid',gridTemplateColumns:'minmax(0,1fr) 110px 100px',alignItems:'center',gap:8,padding:'7px 0',borderTop:'1px solid var(--spira-line)'}}>
            <span style={{fontSize:13,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.type}</span>
            <StateTag status={r.status} overdue={od}/>
            <span style={{textAlign:'right'}}><MiniAction status={r.status} onSet={s=>setStatus(p.id,r.id,s)}/></span>
          </div>)}
        </div>}
      </div>;})}
    <Foot/></Card>;
}

const mount=(id,t,s,C)=>ReactDOM.createRoot(document.getElementById(id)).render(<div style={{position:'relative'}}><div className="frameLabel"><b>{t}</b><span>{s}</span></div><C/></div>);
mount('wid','Widget en Resumen','Mismo acordeón, compacto. Muestra los 5 más urgentes y enlaza al módulo.',W1);
})();</script>
</body>
</html>
