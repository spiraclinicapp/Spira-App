<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="design_doc_mode" content="canvas">
<title>Spira · Tags de estado — variantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; background: #EDE9DD; }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  .label { position: absolute; top: -30px; left: 0; font-family: 'Hanken Grotesk', sans-serif; font-weight: 700; font-size: 15px; color: #14302E; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="SpiraVilanos.jsx"></script>
<script type="text/babel" src="Icons.jsx"></script>
<script type="text/babel" src="spiraTokens.jsx"></script>
<script type="text/babel">
const S = window.SPIRA;
const accent = "#2E7D74";
const warnDeep = "#8A631F";

function card() { return { width: 320, fontFamily: S.fontText, background: S.white, border: `1px solid ${S.line}`, borderRadius: 16, padding: "16px 18px", display: "flex", flexDirection: "column" }; }
const items = [
  { t: "Firmar 4 visitas de EFC18419", m: "auditoría el 27 de agosto", tone: warnDeep, s: "vence 25/08" },
  { t: "Reprogramar 2 visitas fuera de ventana", m: null, tone: S.danger, s: "atrasada" },
  { t: "Apósitos hidrocoloides · R. Benítez", m: "solicitada hoy 09:10", tone: warnDeep, s: "urgente" },
  { t: "Insulina glargina · M. Aguirre", m: "solicitada hace 2 h", tone: S.muted, s: "en revisión" },
];

// V1 — referencia: pill sólido con color de fondo (estado actual)
function TagsV1() {
  return (
    <div style={card()}>
      {items.map((it, i) => (
        <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "11px 0", borderTop: i ? `1px solid ${S.line}` : "none" }}>
          <span style={{ fontSize: 13.5, fontWeight: 600, flex: 1 }}>{it.t}</span>
          <span style={{ display: "inline-flex", alignItems: "center", height: 22, padding: "0 9px", borderRadius: 999, fontSize: 11.5, fontWeight: 600, background: it.tone + "1a", color: it.tone }}>{it.s}</span>
        </div>
      ))}
    </div>
  );
}

// V2 — el estado pasa a ser la segunda línea del ítem, en lugar de una etiqueta aparte
function TagsV2() {
  return (
    <div style={card()}>
      {items.map((it, i) => (
        <div key={i} style={{ padding: "11px 0", borderTop: i ? `1px solid ${S.line}` : "none" }}>
          <div style={{ fontSize: 13.5, fontWeight: 600 }}>{it.t}</div>
          <div style={{ fontSize: 12, color: it.tone, fontWeight: 700, marginTop: 3 }}>{it.s}</div>
        </div>
      ))}
    </div>
  );
}

// V3 — el estado se integra en la misma oración, separado por un punto medio
function TagsV3() {
  return (
    <div style={card()}>
      {items.map((it, i) => (
        <div key={i} style={{ padding: "11px 0", borderTop: i ? `1px solid ${S.line}` : "none", fontSize: 13.5 }}>
          <span style={{ fontWeight: 600 }}>{it.t}</span><span style={{ color: S.faint }}> · </span><span style={{ color: it.tone, fontWeight: 700 }}>{it.s}</span>
        </div>
      ))}
    </div>
  );
}

// V4 — tag cuadrado (esquinas rectas), monoespaciado, como una etiqueta de archivo
function TagsV4() {
  return (
    <div style={card()}>
      {items.map((it, i) => (
        <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "11px 0", borderTop: i ? `1px solid ${S.line}` : "none" }}>
          <span style={{ fontSize: 13.5, fontWeight: 600, flex: 1 }}>{it.t}</span>
          <span style={{ fontFamily: S.mono, fontSize: 10.5, fontWeight: 500, letterSpacing: ".02em", color: it.tone, border: `1px solid ${it.tone}55`, padding: "3px 6px" }}>{it.s}</span>
        </div>
      ))}
    </div>
  );
}

// V5 — solo un ícono de estado, sin texto (color + forma comunican el significado)
function TagsV5() {
  const iconFor = (s) => s === "vence 25/08" ? "clock" : s === "atrasada" ? "alert" : s === "urgente" ? "alert" : "clock";
  return (
    <div style={card()}>
      {items.map((it, i) => (
        <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "11px 0", borderTop: i ? `1px solid ${S.line}` : "none" }}>
          <span style={{ fontSize: 13.5, fontWeight: 600, flex: 1 }}>{it.t}</span>
          <Icon name={iconFor(it.s)} size={16} color={it.tone} stroke={2} />
        </div>
      ))}
    </div>
  );
}

function App() {
  const gap = 360;
  return (
    <div style={{ position: "relative", width: gap * 5, height: 260 }}>
      <div style={{ position: "absolute", left: 0, top: 50 }}><span className="label">V1 · Pill sólido (actual)</span><TagsV1 /></div>
      <div style={{ position: "absolute", left: gap, top: 50 }}><span className="label">V2 · Segunda línea, sin etiqueta</span><TagsV2 /></div>
      <div style={{ position: "absolute", left: gap * 2, top: 50 }}><span className="label">V3 · Integrado en la oración</span><TagsV3 /></div>
      <div style={{ position: "absolute", left: gap * 3, top: 50 }}><span className="label">V4 · Etiqueta cuadrada, monoespaciada</span><TagsV4 /></div>
      <div style={{ position: "absolute", left: gap * 4, top: 50 }}><span className="label">V5 · Solo ícono, sin texto</span><TagsV5 /></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
