  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

map<\u002Fdiv>\n      <h1 style=\"font-family:'Schibsted Grotesk',sans-serif;font-weight:700;font-size:176px;line-height:.86;letter-spacing:-.03em;margin:0;color:#F4F1EA;\">Spira<\u002Fh1>\n      <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-weight:500;font-size:44px;letter-spacing:-.01em;color:#F4F1EA;margin-top:32px;\">Hacia un ecosistema clínico unificado<\u002Fdiv>\n      <p style=\"font-size:24px;line-height:1.55;color:rgba(244,241,234,.78);max-width:660px;margin:28px 0 0;\">Un mapa de producto para el próximo año: dónde estamos hoy y hacia dónde quiero llevarlo.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"position:absolute;left:0;bottom:62px;display:flex;align-items:center;gap:16px;font-family:'IBM Plex Mono',monospace;font-size:17px;color:rgba(244,241,234,.62);z-index:2;\">\n      <span>Lautaro Molina<\u002Fspan>\n      <span style=\"width:5px;height:5px;border-radius:50%;background:rgba(244,241,234,.4);\"><\u002Fspan>\n      <span>Junio 2026<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"El insight\" data-screen-label=\"02\" data-speaker-notes=\"Idea central de toda la presentación. El paciente —y específicamente la fecha en que viene— es el origen de todo lo demás. De ahí se desprende el argumento clave: un solo ecosistema en vez de muchos sistemas sueltos.\" style=\"background:#F4F1EA;color:#14302E;font-family:'Hanken Grotesk',system-ui,sans-serif;display:flex;padding:80px 110px;\">\n  <div style=\"width:100%;height:100%;display:flex;flex-direction:column;\">\n    <div style=\"font-weight:700;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#A6B0AC;margin-bottom:30px;\">El punto de partida<\u002Fdiv>\n    <div style=\"flex:1;display:flex;gap:72px;min-height:0;\">\n      <div style=\"flex:0 0 43%;display:flex;flex-direction:column;\">\n        <h2 style=\"font-family:'Schibsted Grotesk',sans-serif;font-weight:700;font-size:76px;line-height:1.02;letter-spacing:-.025em;margin:0;\">Todo empieza<br>con el <span style=\"color:#2E7D74;\">paciente.<\u002Fspan><\u002Fh2>\n        <p style=\"font-size:23px;line-height:1.5;color:#7C8C87;max-width:520px;margin:28px 0 0;\">Y no importa sólo que el paciente venga: importa <span style=\"color:#14302E;font-weight:600;\">cuándo<\u002Fspan> viene. Esa fecha dispara toda la cascada operativa del centro.<\u002Fp>\n        <div style=\"margin-top:auto;background:#0F5F57;color:#F4F1EA;border-radius:18px;padding:28px 30px;\">\n          <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-weight:500;font-size:27px;line-height:1.25;\">Si todo se vincula al paciente, no necesitamos muchos sistemas.<br><span style=\"font-weight:700;\">Necesitamos uno.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;display:flex;flex-direction:column;min-width:0;\">\n        <div style=\"display:inline-flex;align-self:flex-start;align-items:center;gap:12px;background:#2E7D74;color:#F4F1EA;border-radius:999px;padding:14px 24px 14px 18px;box-shadow:0 12px 32px rgba(20,48,46,.14);\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:22px;height:22px;\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"><\u002Frect><path d=\"M16 2v4M8 2v4M3 10h18\"><\u002Fpath><\u002Fsvg>\n          <span style=\"font-family:'Schibsted Grotesk',sans-serif;font-weight:700;font-size:21px;\">Llega el paciente<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"position:relative;flex:1;margin-top:8px;padding-left:4px;\">\n          <div style=\"position:absolute;left:18px;top:0;bottom:18px;width:2px;background:#D8CBB0;\"><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:14px;padding-top:18px;\">\n\n            <div style=\"display:flex;align-items:center;gap:20px;position:relative;\">\n              <span style=\"flex:0 0 auto;width:14px;height:14px;border-radius:50%;backgr <\u002Fpath><path d=\"m8.5 8.5 7 7\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                <div><div style=\"font-family:'Schibsted Grotesk',sans-serif;font-weight:700;font-size:19px;\">Insumos y medicación<\u002Fdiv><div style=\"font-size:15px;color:#7C8C87;margin-top:1px;\">Lo que hay que dispensar.<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;align-items:center;gap:20px;position:relative;\">\n              <span style=\"flex:0 0 auto;width:14px;height:14px;border-radius:50%;background:#2E7D74;border:4px solid #F4F1EA;margin-left:11px;z-index:2;\"><\u002Fspan>\n              <div style=\"flex:1;background:#fff;border:1px solid #E4DECF;border-radius:14px;padding:15px 20px;display:flex;align-items:center;gap:16px;box-shadow:0 1px 2px rgba(20,48,46,.06);\">\n                <span style=\"width:40px;height:40px;border-radius:10px;background:rgba(46,125,116,.12);display:grid;place-items:center;color:#2E7D74;flex:0 0 auto;\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:20px;height:20px;\"><line x1=\"12\" y1=\"2\" x2=\"12\" y2=\"22\"><\u002Fline><path d=\"M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                <div><div style=\"font-family:'Schibsted Grotesk',sans-serif;font-weight:700;font-size:19px;\">Gastos operativos<\u002Fdiv><div style=\"font-size:15px;color:#7C8C87;margin-top:1px;\">Costos asociados a la visita.<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;align-items:center;gap:20px;position:relative;\">\n              <span style=\"flex:0 0 auto;width:14px;height:14px;border-radius:50%;background:#2E7D74;border:4px solid #F4F1EA;margin-left:11px;z-index:2;\"><\u002Fspan>\n              <div style=\"flex:1;background:#fff;border:1px solid #E4DECF;border-radius:14px;padding:15px 20px;display:flex;align-items:center;gap:16px;box-shadow:0 1px 2px rgba(20,48,46,.06);\">\n                <span style=\"width:40px;height:40px;border-radius:10px;background:rgba(46,125,116,.12);display:grid;place-items:center;color:#2E7D74;flex:0 0 auto;\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:20px;height:20px;\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"><\u002Frect><path d=\"M16 2v4M8 2v4M3 10h18\"><\u002Fpath><path d=\"m9 16 2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                <div><div style=\"font-family:'Schibsted Grotesk',sans-serif;font-weight:700;font-size:19px;\">Visitas y seguimiento<\u002Fdiv><div style=\"font-size:15px;color:#7C8C87;margin-top:1px;\">Ventanas, controles, agenda.<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;align-items:center;gap:20px;position:relative;\">\n              <span style=\"flex:0 0 auto;width:14px;height:14px;border-radius:50%;background:#2E7D74;border:4px solid #F4F1EA;margin-left:11px;z-index:2;\"><\u002Fspan>\n              <div style=\"flex:1;background:#fff;border:1px solid #E4DECF;border-radius:14px;padding:15px 20px;display:flex;align-items:center;gap:16px;box-shadow:0 1px 2px rgba(20,48,46,.06);\">\n                <span style=\"width:40px;height:40px;border-radius:10px;background:rgba(46,125,116,.12);display:grid;place-items:center;color:#2E7D74;flex:0 0 auto;\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:20px;height:20px;\"><path d=\"M3 3v18h18\"><\u002Fpath><path d=\"m7 14 4-4 3 3 5-6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                <div><div style=\"font-family:'Schibsted Grotesk',sans-serif;font-weight:700;font-size:19px;\">Datos y reportes<\u002Fdiv><div style=\"font-size:15px;color:#7C8C87;margin-top:1px;\">Información para decidir.<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Ecosistema\" data-screen-label=\"03\" data-speaker-notes=\"Acá se explica la decisión de arquitectura: en vez de varios sistemas sueltos, un único ecosistema con permisos por rol, todo apoyado en un Core compartido (pacientes, protocolos, Supabase). Verificar los números antes de presentar.\" style=\"background:#F4F1EA;color:#14302E;font-family:'Hanken Grotesk',system-ui,sans-serif;display:flex;padding:80px 110px;\">\n  <div style=\"width:100%;height:100%;display:flex;gap:48px;align-items:center;\">\n    <div style=\"flex:0 0 44%;display:flex;flex-direction:column;\">\n      <div style=\"font-weight:700;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#A6B0AC;margin-bottom:26px;\">La idea de fondo<\u002Fdiv>\n      <h2 style=\"font-family:'Schibsted Grotesk',sans-serif;font-weight:700;font-size:64px;line-height:1.03;letter-spacing:-.025em;margin:0;\">Un solo ecosistema,<br>muchos roles<\u002Fh2>\n      <p style=\"font-size:23px;line-height:1.5;color:#7C8C87;max-width:540px;margin:24px 0 0;\">Cada persona ve su módulo según su rol y sus permisos. Todo convive sobre la misma base: pacientes y protocolos.<\u002Fp>\n      <div style=\"margin-top:28px;background:#FBFAF6;border:1px solid #E4DECF;border-radius:16px;padding:20px 22px;display:flex;gap:15px;max-width:560px;\">\n        <span style=\"width:40px;height:40px;border-radius:10px;background:rgba(15,95,87,.1);display:grid;place-items:center;color:#0F5F57;flex:0 0 auto;\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:21px;height:21px;\"><ellipse cx=\"12\" cy=\"5\" rx=\"9\" ry=\"3\"><\u002Fellipse><path d=\"M3 5v14a9 3 0 0 0 18 0V5M3 12a9 3 0 0 0 18 0\"><
