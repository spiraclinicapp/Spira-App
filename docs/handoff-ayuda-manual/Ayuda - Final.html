<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spira · Ayuda en la app v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#14302E;--primary:#0F5F57;--paper:#F4F1EA;--surface:#FBFAF6;--white:#FFFFFF;--muted:#7C8C87;--faint:#A6B0AC;--ink-soft:#556966;--line:#E4DECF;--line-2:#D8CBB0;--on-accent:#F4F1EA;--mint:#E6EFEC;--fd:'Schibsted Grotesk',system-ui,sans-serif;--ft:'Inter',system-ui,sans-serif;--fm:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:#EDE9DF;color:var(--ink);font-family:var(--ft);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none}a:hover{color:var(--ink)}
button{font-family:inherit;color:inherit;cursor:pointer}
.ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.ui{font-weight:600;color:var(--ink);background:#F1EDE3;border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:.93em;white-space:nowrap}
.top{max-width:1400px;margin:0 auto;padding:20px 24px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.top h1{margin:0;font:700 20px/1.2 var(--fd);letter-spacing:-.01em;flex-basis:100%}
.ctl{display:flex;align-items:center;gap:8px}
.ctl>span{font-size:12px;color:var(--muted);font-weight:600}
.seg{display:flex;gap:3px;padding:3px;background:var(--white);border:1px solid var(--line-2);border-radius:10px;flex-wrap:wrap}
.seg button{white-space:nowrap;border:0;background:transparent;padding:5px 10px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.seg button.on{background:var(--ink);color:var(--on-accent)}
.note{font-size:12.8px;color:var(--ink-soft);flex-basis:100%;max-width:100ch;margin:0}
.note b{color:var(--ink)}

.app{max-width:1400px;margin:0 auto 40px;height:780px;border:1px solid var(--line-2);border-radius:14px;overflow:hidden;position:relative;background:var(--paper);display:grid;grid-template-rows:60px minmax(0,1fr)}
.bar{background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px}
.logo{font:700 19px/1 var(--fd);display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 50% 100%,#2E7D74 0 40%,transparent 41%)}
.vsep{width:1px;height:24px;background:var(--line)}
.modname{font:700 16px/1 var(--fd)}
.gsearch{margin-left:auto;height:36px;width:210px;border:1px solid var(--line-2);border-radius:9px;display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--muted);font-size:13px}
.avatar{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px}
.avatar b{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--primary);display:grid;place-items:center;font-size:10.5px;color:var(--primary)}
.body{display:grid;grid-template-columns:62px 210px minmax(0,1fr);min-height:0}
.rail{background:var(--white);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0}
.rail span{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink-soft)}
.rail span.on{background:var(--mint);color:var(--primary)}
.rail .help{margin-top:auto;border:0;background:transparent;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink-soft)}
.rail .help:hover{background:var(--paper)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px}
.side .k{font:800 10.5px/1 var(--fd);letter-spacing:.12em;color:var(--muted);margin:0 8px 12px}
.side .it{padding:7px 10px;border-radius:8px;font-size:13.5px;font-weight:600;margin-bottom:2px}
.side .it small{display:block;font-size:11.5px;font-weight:400;color:var(--muted)}
.side .it.on{background:#E3E8E1}
.main{padding:12px 26px;min-width:0}.main .emp{margin-top:12px}
.crumb{font-size:12px;color:var(--muted)}.crumb b{color:var(--ink);font-weight:600}
.th{display:flex;align-items:center;gap:10px;margin-top:2px;flex-wrap:wrap}
.th h2{margin:0;font:700 25px/1.15 var(--fd);letter-spacing:-.02em}
.btn{white-space:nowrap;margin-left:auto;height:38px;padding:0 15px;border-radius:9px;border:0;background:var(--primary);color:var(--on-accent);font:700 13.5px/1 var(--fd)}
.bj{height:16px;display:flex;align-items:center;padding-left:1px}.bd{display:flex;align-items:center;gap:14px;font:400 12.5px/16px var(--ft);color:var(--muted);white-space:nowrap}.bd button{border:0;background:transparent;padding:0;font:500 12.5px/16px var(--ft);color:var(--ink-soft);display:inline-flex;align-items:center;gap:5px;text-decoration:underline dotted var(--faint);text-underline-offset:3px}.bd button svg{width:14px;height:14px}.bd button:hover{color:var(--ink)}
.lk{position:relative;display:inline-flex}.lk:hover .globo,.lk:focus-within .globo{display:block}
.globo{position:absolute;z-index:5;top:26px;left:-14px;width:340px;background:var(--white);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 14px 34px rgba(20,48,46,.16);padding:14px;display:none;white-space:normal}.globo::before{content:"";position:absolute;top:-6px;left:18px;width:10px;height:10px;background:var(--white);border-left:1px solid var(--line-2);border-top:1px solid var(--line-2);transform:rotate(45deg)}.globo::after{content:"";position:absolute;left:0;right:0;top:-14px;height:14px}.globo .gt{font:700 14.5px/1.3 var(--fd);color:var(--ink)}.globo .gx{font-size:12.8px;color:var(--ink-soft);margin-top:3px;line-height:1.5}.globo .vid{margin-top:10px}.globo .gf{display:flex;align-items:center;margin-top:9px;font-size:12px;color:var(--muted)}.globo .gf button{margin-left:auto;border:0;background:transparent;padding:0;font-weight:600;font-size:12px;color:var(--primary);text-decoration:none}
.emp{margin-top:22px;background:var(--white);border:1px solid var(--line);border-radius:12px;height:300px;display:grid;place-items:center;text-align:center;color:var(--ink-soft);font-size:13px}
.emp b{display:block;font:700 15px/1.3 var(--fd);color:var(--ink)}

.disk{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--primary);display:grid;place-items:center;position:relative;border:0;padding:0}
.disk svg{width:10px;height:10px;fill:var(--on-accent);margin-left:2px}
.disk.sm{width:20px;height:20px}.disk.sm svg{width:8px;height:8px}
.disk.lg{width:54px;height:54px;box-shadow:0 6px 18px rgba(15,95,87,.35)}.disk.lg svg{width:18px;height:18px;margin-left:3px}
.disk.new::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--primary);animation:halo 2.4s ease-out infinite}
@keyframes halo{0%{transform:scale(1);opacity:.55}70%,100%{transform:scale(1.85);opacity:0}}
.disk.seen{background:var(--white);border:1.5px solid var(--primary)}.disk.seen svg{fill:var(--primary)}
.dur{font-family:var(--fm);font-size:11px;color:var(--muted)}
.txtic{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;color:var(--muted)}
.txtic svg{width:11px;height:11px}

.scrim{position:absolute;inset:0;background:rgba(20,48,46,.22);opacity:0;pointer-events:none;transition:opacity .2s}
.app.open .scrim{opacity:1;pointer-events:auto}
.panel{position:absolute;top:0;right:0;bottom:0;width:440px;max-width:100%;background:var(--white);border-left:1px solid var(--line);box-shadow:-14px 0 34px rgba(20,48,46,.14);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease}
.app.open .panel{transform:none}
.ph{padding:16px 20px 12px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line);position:relative}
.ph.tabs{padding-bottom:0}
.pt{display:flex;align-items:center;gap:8px;min-height:30px}
.pt h3{margin:0;font:700 21px/1.1 var(--fd);letter-spacing:-.01em}
.mbtn{margin-left:auto;display:flex;align-items:center;gap:7px;height:34px;padding:0 13px;border:0;border-radius:9px;font:700 13px/1 var(--fd);color:var(--on-accent);background:var(--ink);white-space:nowrap}.mbtn:hover{background:#2A4A47;color:var(--on-accent)}.mbtn+.x{margin-left:0}
.x{margin-left:auto;border:0;background:transparent;color:var(--ink-soft);padding:4px;display:grid}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--line-2);border-radius:10px;color:var(--muted)}
.search input{border:0;outline:0;flex:1;font:inherit;font-size:13.5px;color:var(--ink);background:transparent;min-width:0}
.search:focus-within{border-color:var(--muted)}
.search.big{height:46px;border-radius:12px}

/* switch: chips */
.sw-chips{display:flex;gap:6px}
.sw-chips button{flex:1 1 auto;padding:5px 8px !important;gap:5px !important;min-width:0;justify-content:center;white-space:nowrap;border:1px solid var(--line-2);background:var(--white);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
.sw-chips button.on{background:var(--ink);border-color:var(--ink);color:var(--on-accent)}.sw-chips button.on svg{color:var(--on-accent) !important}
.here{width:6px;height:6px;border-radius:50%;background:#2E7D74;flex:0 0 auto}
/* switch: segmentado */
.sw-seg{display:flex;padding:3px;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.sw-seg button{flex:1 1 auto;min-width:0;border:0;background:transparent;padding:7px 4px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.sw-seg button.on{background:var(--white);color:var(--ink);box-shadow:0 1px 3px rgba(20,48,46,.12)}
/* switch: pestañas */
.sw-tabs{display:flex;gap:0;margin:-2px -20px 0;padding:0 8px}
.sw-tabs button{flex:1 1 auto;gap:5px !important;min-width:0;justify-content:center;border:0;background:transparent;padding:8px 0 10px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.sw-tabs button.on{color:var(--ink);border-bottom-color:var(--primary)}
/* switch: desplegable */
.dd{display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--white);border-radius:9px;height:32px;padding:0 9px 0 10px;font:600 13px/1 var(--ft);color:var(--ink)}
.dd:hover{background:var(--paper)}
.ddm{position:absolute;left:20px;top:56px;width:280px;background:var(--white);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 14px 34px rgba(20,48,46,.16);padding:6px;z-index:5}
.ddm button{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;background:transparent;border-radius:8px;text-align:left;font-size:13.5px;font-weight:600}
.ddm button:hover{background:var(--paper)}
.ddm button.on{background:var(--mint)}
.ddm small{margin-left:auto;font-weight:500;font-size:12px;color:var(--muted)}

.pb{flex:1;overflow:auto;padding:4px 20px 20px}
.pb>*{animation:in .2s ease}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pf{border-top:1px solid var(--line);padding:11px 20px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft)}
.pf a{font-weight:600}
.pf .r{margin-left:auto;display:flex;align-items:center;gap:5px}
.sec{font:800 10.5px/1 var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec span{font:500 11.5px/1 var(--ft);letter-spacing:0;text-transform:none}

/* vista módulo (1b) */
.vid{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/9;background:repeating-linear-gradient(135deg,#EFEBE1 0 10px,#F6F3EC 10px 20px)}
.vid .lbl{position:absolute;left:10px;top:9px;font-family:var(--fm);font-size:10.5px;color:var(--muted)}
.vid .center{position:absolute;inset:0;display:grid;place-items:center}
.vid .cd{position:absolute;right:8px;bottom:8px;background:rgba(20,48,46,.82);color:var(--on-accent);font-family:var(--fm);font-size:11px;padding:2px 6px;border-radius:5px}
.vid .barp{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(20,48,46,.12)}
.vid .barp i{display:block;height:100%;background:var(--primary);transition:width .3s}
.vid.playing .center .disk{opacity:0;transform:scale(.6);transition:.2s}
.vid.playing::before{content:"reproduciendo…";position:absolute;left:10px;bottom:12px;font-family:var(--fm);font-size:10.5px;color:var(--primary)}
.vtitle{font:700 15px/1.3 var(--fd);margin:12px 0 4px}
.chap{display:flex;gap:10px;padding:9px 8px;margin:0 -8px;border-radius:8px;align-items:flex-start;border:0;background:transparent;width:calc(100% + 16px);text-align:left}
.chap:hover{background:var(--paper)}
.chap.on{background:var(--mint)}
.chap .n{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);font:700 10.5px/17px var(--fd);text-align:center;color:var(--ink-soft)}
.chap.on .n{background:var(--primary);border-color:var(--primary);color:var(--on-accent)}
.chap .ct{flex:1;font-size:13px;color:var(--ink-soft);line-height:1.5}
.chap .ct b.h{display:block;color:var(--ink);font-size:13.4px;margin-bottom:1px}
.q{border-bottom:1px solid var(--line)}
.qb{width:100%;display:flex;align-items:center;gap:10px;padding:12px 0;border:0;background:transparent;text-align:left;font-weight:600;font-size:13.6px;color:var(--ink)}
.qb>span{flex:1}
.qb .chev{color:var(--faint);transition:transform .15s}
.q.open .chev{transform:rotate(180deg)}
.qa{display:none;padding:0 0 13px;font-size:13.2px;color:var(--ink-soft);line-height:1.6}
.q.open .qa{display:block}
.qa p{margin:0 0 8px}
.jump{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.3px;color:var(--primary);border:0;background:transparent;padding:0}
.tcard{display:flex;gap:12px;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;text-align:left;align-items:center}
.tcard:hover .tt{color:var(--primary)}
.thumb{flex:0 0 auto;width:88px;aspect-ratio:16/10;border-radius:8px;border:1px solid var(--line);background:repeating-linear-gradient(135deg,#EFEBE1 0 7px,#F6F3EC 7px 14px);position:relative;display:grid;place-items:center}
.thumb .cd{position:absolute;right:4px;bottom:4px;background:rgba(20,48,46,.82);color:var(--on-accent);font-family:var(--fm);font-size:10px;padding:1px 4px;border-radius:4px}
.tt{font-weight:600;font-size:13.6px;line-height:1.35}
.ts{font-size:12.3px;color:var(--ink-soft);margin-top:2px;line-height:1.45}
.tm{font-size:11.5px;color:var(--muted);margin-top:3px}

/* inicio B: módulos */
.here-card{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);align-items:center;width:100%;text-align:left;margin-top:14px}
.here-card:hover{border-color:var(--line-2)}
.mcard{width:100%;text-align:left;border:1px solid var(--line);background:var(--white);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.mcard:hover{background:var(--surface)}
.mcard .mh{display:flex;align-items:center;gap:10px}
.mi{width:34px;height:34px;border-radius:9px;background:var(--mint);color:var(--primary);display:grid;place-items:center;flex:0 0 auto}
.mn{font:700 15px/1.2 var(--fd)}
.ms{font-size:12px;color:var(--muted)}
.prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--primary)}
.mq{font-size:12.6px;color:var(--ink-soft);display:flex;flex-direction:column;gap:3px}
.mq span::before{content:"— ";color:var(--faint)}
/* inicio C: preguntas */
.hq{display:flex;align-items:center;gap:11px;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;text-align:left}
.hq:hover .tt{color:var(--primary)}
.hq .tt{flex:1;font-size:13.5px}
.hq .mt{font-size:11.5px;color:var(--muted);white-space:nowrap}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mtile{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 10px;text-align:left;display:flex;flex-direction:column;gap:8px}
.mtile:hover{background:var(--paper)}
.mtile .mn{font-size:13.5px}
.mrow{width:100%;display:flex;align-items:center;gap:12px;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}.mrow:hover .mn{color:var(--primary)}
.manual-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:18px;color:var(--ink)}.manual-row:hover{background:var(--surface);color:var(--ink)}
.bk{width:40px;height:40px;border-radius:10px;background:#F1EDE3;display:grid;place-items:center;color:var(--ink);flex:0 0 auto}.bk svg{width:20px;height:20px}
.manual-band{display:flex;gap:14px;align-items:center;padding:16px;border-radius:12px;background:#F1EDE3;margin-top:18px}
.manual-band .bk{background:var(--white)}
.mb-btn{margin-left:auto;flex:0 0 auto;height:34px;padding:0 13px;border-radius:9px;background:var(--ink);color:var(--on-accent);font:700 12.5px/34px var(--fd);white-space:nowrap}.mb-btn:hover{color:var(--on-accent);background:var(--primary)}
.ix-h{display:flex;align-items:center;gap:8px;margin:20px 0 4px}.ix-h .mn{font-size:14px;flex:1}.ix-h button{border:0;background:transparent;font-size:12.3px;font-weight:600;color:var(--primary);padding:0}
.ix{display:flex;align-items:center;gap:10px;padding:7px 0;border:0;background:transparent;width:100%;text-align:left;font-size:13.2px;color:var(--ink-soft)}.ix:hover{color:var(--ink)}.ix .dur{margin-left:auto}
.mfoot{display:flex;align-items:center;gap:12px;margin:0;padding:12px 20px;background:#F1EDE3;border-top:1px solid var(--line);color:var(--ink)}.mfoot:hover{background:#ECE7DB;color:var(--ink)}
.inman{display:inline-flex;align-items:center;gap:6px;font-size:12.3px;font-weight:600;color:var(--ink-soft)}.inman:hover{color:var(--ink)}.inman svg{width:14px;height:14px}
.empty-s{padding:30px 0;text-align:center;color:var(--muted);font-size:13px}
mark{background:var(--mint);color:inherit;border-radius:3px;padding:0 1px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><symbol id="play" viewBox="0 0 10 10"><path d="M1.5 1 9 5 1.5 9z"></path></symbol></defs></svg>
<div class="top"><h1>Ayuda · versión final</h1>
<div class="ctl"><span>Estás en</span><div class="seg" data-ctl="w"><button data-v="pharma" class="on">Dispensaciones</button><button data-v="track">Visitas</button><button data-v="inicio">Inicio</button></div></div>
<p class="note" id="note"></p></div>

<div class="app open" id="app">
<div class="bar"><span class="logo"><i></i>Spira</span><span class="vsep"></span><span class="modname" id="modname">Farmacia</span><span class="gsearch"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Buscar…</span><span class="avatar"><b>SC</b>Spira Clinic</span></div>
<div class="body">
<div class="rail"><span><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg></span><span id="r-track"><svg class="ico" viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"></path></svg></span><span id="r-pharma" class="on"><svg class="ico" viewBox="0 0 24 24"><path d="m10.5 20.5-7-7a5 5 0 0 1 7-7l7 7a5 5 0 0 1-7 7zM8.5 8.5l7 7"></path></svg></span>

return h}
function homeC(){let h=`<div style="font:700 17px/1.3 var(--fd);margin:14px 0 10px">¿Qué querés hacer?</div><label class="search big"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input id="q2" placeholder="Ej.: dispensar, reprogramar, campana"></label>`;
if(S.man==='C')h+=`<div class="manual-band"><span class="bk">${BOOK}</span><div style="min-width:0"><div class="mn" style="font-size:14.5px">Manual de usuario</div><div class="ms" style="font-size:12.3px;color:var(--ink-soft)">Cada tarea explicada, con su video</div></div><a class="mb-btn" href="Manual de usuario.html">Abrir manual</a></div>`;
h+=`<div class="sec" style="margin-top:22px">Lo más consultado</div>`;
h+=POP.map(([k,id])=>{if(k==='t'){const t=T.find(x=>x.id===id);return `<button class="hq" data-go-tut="${id}">${dk(t)}<span class="tt">${t.t}</span><span class="mt">${MODS[t.m].c} · <span class="dur">${t.d}</span></span></button>`}
const q=Q.find(x=>x.id===id);return `<button class="hq" data-go-q="${id}">${TXT}<span class="tt">${fmt(q.t)}</span><span class="mt">${MODS[q.m].c}</span></button>`}).join('');
h+=`<div class="sec" style="margin-top:22px">Por módulo</div><div class="mgrid">${sorted().map(k=>{const v=T.filter(t=>t.m===k);return `<button class="mtile" data-sw="${k}"><span class="mi" style="background:${EMP[k][0]}1A">${EM[k].replace('15px;height:15px','18px;height:18px')}</span><div><div class="mn">${MODS[k].n}</div><div class="ms">${v.length} tutoriales</div></div></button>`}).join('')}</div>`;
return h}
function search(){const s=S.q.toLowerCase().trim(),re=new RegExp('('+s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),hl=x=>fmt(x).replace(re,'<mark>$1</mark>');
const rt=T.filter(t=>(t.t+t.s+t.ch.map(c=>c.join(' ')).join(' ')+t.q.map(q=>q.join(' ')).join(' ')).toLowerCase().includes(s));
const rq=Q.filter(q=>(q.t+q.a).toLowerCase().includes(s));
if(!rt.length&&!rq.length)return `<div class="empty-s">Nada para «${S.q}».<br><a href="#">Contanos qué buscabas</a></div>`;
return `<div class="sec">Resultados<span>${rt.length+rq.length}</span></div>`+rt.map(t=>`<button class="hq" data-go-tut="${t.id}">${dk(t)}<span class="tt">${hl(t.t)}</span><span class="mt">${MODS[t.m].c} · <span class="dur">${t.d}</span></span></button>`).join('')+rq.map(q=>`<button class="hq" data-go-q="${q.id}">${TXT}<span class="tt">${hl(q.t)}</span><span class="mt">${MODS[q.m].c}</span></button>`).join('')}
function render(){head();$('mf').innerHTML=S.man==='B'?`<a class="mfoot" href="Manual de usuario.html"><span class="bk" style="background:var(--white)">${BOOK}</span><div style="min-width:0"><div class="mn" style="font-size:14px">Manual de usuario</div><div class="ms" style="color:var(--ink-soft)">${S.view==='mod'?'Abrí '+MODS[S.mod].n+' en el manual':'Cada tarea paso a paso, con su video'}</div></div>${ARR}</a>`:'';$('pb').innerHTML=S.q.trim()?search():S.view==='home'?({L:homeL,F:homeF,I:homeI,C:homeC}[S.home]||homeL)():modView();
const q2=$('q2');if(q2)q2.oninput=e=>{S.q=e.target.value;render();const n=$('q');if(n){n.focus();n.setSelectionRange(99,99)}};
$('note').innerHTML='Bajada con la descripción del submódulo y «¿Qué puedo hacer acá?»: al pasar el mouse abre el tutorial. La Ayuda: inicio con preguntas primero, pestañas con íconos y el manual dentro del contenido.'.replace(/«([^»]+)»/g,'<span class="ui">$1</span>');}
function renderApp(){const w=WHERE[S.w];
$('side').innerHTML=w.side.length?`<div class="k">SUBMÓDULOS</div>`+w.side.map(s=>`<div class="it${s[0]===w.view?' on':''}">${s[0]}<small>${s[1]}</small></div>`).join(''):'';
const t=T.find(x=>x.m===w.mod&&x.view===w.view);
const desc=(w.side.find(x=>x[0]===w.view)||[])[1]||'';
$('main').innerHTML=`<div class="crumb">${w.mod?'Spira '+MODS[w.mod].n+' › ':''}<b>${w.view}</b></div><div class="th" style="align-items:flex-start"><div><h2>${w.view}</h2>${t?`<div class="bj"><div class="bd"><span>${desc}</span><span class="lk"><button><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.4M12 17h.01"></path></svg>¿Qué puedo hacer acá?</button><div class="globo"><div class="gt">${t.t}</div><div class="gx">${fmt(t.ch.map(c=>c[1]).slice(0,2).join(' '))}</div><div class="vid"><span class="lbl">captura · ${t.view}</span><div class="center"><button class="disk lg ${seen.has(t.id)?'seen':'new'}" data-go-tut="${t.id}" style="text-decoration:none">${P}</button></div><span class="cd">${t.d}</span></div><div class="gf"><span>${t.ch.length} pasos</span><button data-go-tut="${t.id}">Ver en la Ayuda</button></div></div></span></div></div>`:''}</div>${w.act?`<button class="btn">${w.act}</button>`:''}</div><div class="emp"><div><b>${w.empty[0]}</b>${w.empty[1]}</div></div>`;
$('modname').textContent=w.mod?MODS[w.mod].n:'Inicio';
$('r-pharma').classList.toggle('on',S.w==='pharma');$('r-track').classList.toggle('on',S.w==='track')}
function openHelp(){$('app').classList.add('open');S.q='';if(S.home==='A')goMod(curMod());else{S.view='home';S.dd=false}render()}
let timer;
document.addEventListener('click',e=>{const el=e.target.closest('button');
if(!el){if(S.dd&&!e.target.closest('.ddm')){S.dd=false;render()}return}
const ctl=el.closest('[data-ctl]');
if(ctl){S[ctl.dataset.ctl]=el.dataset.v;ctl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));renderApp();openHelp();$('app').classList.remove('open');return}
if(el.id==='openHelp'){openHelp();return}
if(el.id==='close'){$('app').classList.remove('open');clearInterval(timer);S.playing=false;return}
if(el.hasAttribute('data-dd')){S.dd=!S.dd;render();return}
if(el.dataset.sw){S.q='';S.openQ=null;if(el.dataset.sw==='home'){S.view='home';S.dd=false;clearInterval(timer);S.playing=false}else goMod(el.dataset.sw);render();$('pb').scrollTop=0;return}
if(el.dataset.goTut){const t=T.find(x=>x.id===el.dataset.goTut);$('app').classList.add('open');S.q='';S.openQ=null;goMod(t.m,t.id);render();$('pb').scrollTop=0;return}
if(el.dataset.goQ){const q=Q.find(x=>x.id===el.dataset.goQ);S.q='';goMod(q.m);S.openQ=q.id;render();const n=$('q-'+q.id);if(n)$('pb').scrollTop=n.offsetTop-80;return}
if(el.dataset.tut){S.tut=el.dataset.tut;S.chap=0;S.playing=false;S.openQ=null;clearInterval(timer);render();$('pb').scrollTop=0;return}
if(el.dataset.chap!=null){S.chap=+el.dataset.chap;render();return}
if(el.hasAttribute('data-acc')){el.parentElement.classList.toggle('open');return}
if(el.hasAttribute('data-play')){const t=T.find(x=>x.id===S.tut);S.playing=true;seen.add(t.id);render();renderApp();clearInterval(timer);
timer=setInterval(()=>{if(S.chap<t.ch.length-1){S.chap++;render()}else{clearInterval(timer);S.playing=false;render()}},2200);return}
});
$('scrim').onclick=()=>{$('app').classList.remove('open');clearInterval(timer)};
renderApp();openHelp();$('app').classList.remove('open');
</script>
</body>
</html>
