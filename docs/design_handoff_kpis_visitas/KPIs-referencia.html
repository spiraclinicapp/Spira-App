<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Visitas · KPIs — referencia</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#14302E;--ink2:#2A4744;--pri:#0F5F57;--track:#2E7D74;--paper:#F4F1EA;--surf:#FBFAF6;--muted:#61706C;--faint:#A6B0AC;--line:#E4DECF;--line2:#D8CBB0;--good:#5C8A5A;--warn:#B0823F;--danger:#A6483B;--disp:'Schibsted Grotesk',sans-serif;--mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{margin:0;font-family:'Hanken Grotesk',sans-serif;color:var(--ink)}
a{color:var(--pri);text-decoration:none}a:hover{color:var(--ink)}
.fr{position:absolute;left:60px;width:1080px;background:var(--paper);border-radius:18px;padding:64px 28px 28px}
.tag{position:absolute;top:20px;left:28px;display:flex;align-items:center;gap:10px}
.id{font:700 12px var(--mono);background:var(--ink);color:var(--paper);padding:3px 8px;border-radius:6px}
.tt{font:700 15px var(--disp)}
.ds{font-size:13px;color:var(--muted);margin-left:6px}
.row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.c{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;position:relative;color:var(--ink);transition:box-shadow .15s,transform .15s,border-color .15s,background .15s}
.lb{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.n{font:600 36px/1 var(--mono);letter-spacing:-.02em;margin:12px 0 10px;font-variant-numeric:tabular-nums}
.s{font-size:12.5px;color:var(--muted)}
.ar{width:14px;height:14px;flex:0 0 auto}
/* A */
.A .c{display:block;cursor:pointer}
.A .c .go{position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:99px;display:grid;place-items:center;color:var(--pri);opacity:0;transform:translate(-4px,4px);transition:.18s}
.A .c:hover{border-color:var(--line2);box-shadow:0 6px 18px rgba(20,48,46,.08);transform:translateY(-1px)}
.A .c:hover .go{opacity:1;transform:none;background:rgba(15,95,87,.08)}
.A .c:hover .lb{color:var(--ink)}
/* B */
.B .c{padding:0;display:flex;flex-direction:column;overflow:hidden}
.B .bd{padding:18px 20px 14px}
.B .ft{margin-top:auto;border-top:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--muted);transition:.15s}
.B .ft:hover{background:var(--surf);color:var(--pri)}
/* C */
.C .band{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:16px}
.C .seg{padding:18px 22px;border-left:1px solid var(--line);display:block;color:var(--ink);transition:background .15s}
.C .seg:first-child{border-left:0;border-radius:16px 0 0 16px}.C .seg:last-child{border-radius:0 16px 16px 0}
.C .seg:hover{background:var(--surf)}
.C .seg:hover .lb{color:var(--pri)}
.C .lb .ar{margin-left:auto;opacity:0;transition:.15s}.C .seg:hover .lb .ar{opacity:1}
/* D */
.D .c{display:flex;flex-direction:column;cursor:pointer}
.D .c:hover{border-color:var(--line2);box-shadow:0 6px 18px rgba(20,48,46,.08)}
.D .top{display:flex;align-items:baseline;gap:10px;margin:12px 0 12px}
.D .n{margin:0}
.D .unit{font-size:13px;color:var(--muted)}
.D .bar{height:6px;border-radius:99px;background:#EFEBE1;display:flex;overflow:hidden;gap:2px}
.D .bar i{display:block;height:100%;border-radius:99px}
.D .wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.D .wk span{height:22px;border-radius:6px;background:#F3EFE6;display:grid;place-items:center;font:600 10px var(--mono);color:var(--faint)}
.D .wk .on{background:var(--track);color:#fff}.D .wk .hoy{outline:1.5px solid var(--line2);color:var(--ink)}
.D .leg{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:9px}
/* G = A + D */
.G .c{color:var(--ink)}
.G .c .go{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:99px;display:grid;place-items:center;color:var(--pri);opacity:0;transform:translate(-4px,4px);transition:.18s}
.G .c:hover{transform:translateY(-1px)}
.G .c:hover .go{opacity:1;transform:none;background:rgba(15,95,87,.08)}
.G .c:hover .lb{color:var(--ink)}
.wk2{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk2>div{display:flex;flex-direction:column;align-items:center;gap:4px}
.wk2 span{width:100%;height:22px;border-radius:6px;background:#F3EFE6;display:grid;place-items:center;font:600 10px var(--mono);color:var(--faint)}
.wk2 .hoy{outline:1.5px solid var(--line2);color:var(--ink)}
.wk2 .has{background:rgba(46,125,116,.18);color:var(--pri)}
.wk2 .nx{background:var(--track);color:#fff}
.wk2 b{font:600 10.5px/1 var(--mono);color:var(--ink2)}
.wk2 b.z{color:var(--faint);font-weight:500}
.wk2 b.bn{color:var(--pri)}
/* E */
.E .c{display:block;cursor:pointer}
.E .c:hover{box-shadow:0 6px 18px rgba(20,48,46,.08)}
.E .alert{background:#F7ECE7;border-color:#E8CFC5}.E .alert .lb{color:var(--danger)}.E .alert .n{color:var(--danger)}
.E .calm .n{color:var(--faint)}
.E .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:rgba(166,72,59,.12);color:var(--danger)}
/* F */
.F .c{display:block}
.F .cr{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:99px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);transition:.15s}
.F .c:hover .cr{border-color:var(--pri);background:var(--pri);color:#fff}
.F .c:hover{border-color:var(--line2)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><symbol id="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></symbol><symbol id="ne" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"></path></symbol></svg>
<div class="fr D G" style="position:relative;top:0;left:0;margin:40px">
<div class="tag"><span class="id">2A</span><span class="tt">Mezcla 1A + 1D</span><span class="ds">Tarjeta entera como acceso, flecha en hover, y el dato secundario dibujado.</span></div>
<div class="row">
<a class="c" href="#"><span class="go"><svg class="ar"><use href="#ne"></use></svg></span><div class="lb"><span class="dot" style="background:var(--good)"></span>Visitas de hoy</div><div class="top"><span class="n">0</span><span class="unit">de 0</span></div><div class="bar"></div><div class="leg"><span>sin visitas hoy</span></div></a>
<a class="c" href="#"><span class="go"><svg class="ar"><use href="#ne"></use></svg></span><div class="lb"><span class="dot" style="background:var(--danger)"></span>Atrasados</div><div class="top"><span class="n">16</span></div><div class="bar"><i style="width:43.75%;background:var(--danger)"></i><i style="flex:1;background:#E3C9A0"></i></div><div class="leg"><span style="color:var(--danger);font-weight:600">7 ventana vencida</span><span>9 en ventana</span></div></a>
<a class="c" href="#"><span class="go"><svg class="ar"><use href="#ne"></use></svg></span><div class="lb"><span class="dot" style="background:var(--good)"></span>Próximas visitas</div><div class="top"><span class="n">1</span><span class="unit">Miércoles 14/10</span></div><div class="wk2"><div><span class="hoy">L</span><b class="z">0</b></div><div><span>M</span><b class="z">0</b></div><div><span class="nx">M</span><b class="bn">1</b></div><div><span class="has">J</span><b>3</b></div><div><span class="has">V</span><b>2</b></div><div><span>S</span><b class="z">0</b></div><div><span>D</span><b class="z">0</b></div></div></a>
<a class="c" href="#"><span class="go"><svg class="ar"><use href="#ne"></use></svg></span><div class="lb"><span class="dot" style="background:var(--good)"></span>Pacientes activos</div><div class="top"><span class="n">61</span><span class="unit">de 65</span></div><div class="bar"><i style="width:93.8%;background:var(--good)"></i></div><div class="leg"><span>65 registrados</span><span>4 inactivos</span></div></a>
</div></div>

</body></html>
