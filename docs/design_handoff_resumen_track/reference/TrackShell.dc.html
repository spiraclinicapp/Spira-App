<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../../spira-app-tokens.css">
</helmet>
<div style="width:1560px;min-height:800px;display:flex;flex-direction:column;font-family:var(--spira-font-text);color:var(--spira-ink);background:var(--spira-paper);border:1px solid var(--spira-line);border-radius:14px;overflow:hidden;box-shadow:0 18px 40px rgba(20,48,46,.14)">
  <header style="height:60px;flex:0 0 60px;border-bottom:1px solid var(--spira-line);background:var(--spira-white);display:flex;align-items:center;padding:0 18px 0 20px;gap:14px">
    <div style="display:flex;align-items:center;gap:11px">
      <span style="width:38px;height:38px;border-radius:10px;background:var(--spira-surface);display:grid;place-items:center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--spira-ink)" stroke-width="2" stroke-linecap="round"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg>
      </span>
      <img src="../../assets/spira-vilano-petrol.svg" alt="" style="width:26px;height:31px;display:block">
      <span style="font-family:var(--spira-font-display);font-weight:700;font-size:21px;letter-spacing:-0.02em">Spira</span>
      <span style="width:1px;height:26px;background:var(--spira-line);margin:0 5px"></span>
      <span style="display:inline-flex;align-items:center;gap:8px">
        <span style="width:26px;height:26px;border-radius:7px;background:rgba(46,125,116,.09);display:grid;place-items:center">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--spira-track)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
        </span>
        <span style="font-family:var(--spira-font-display);font-weight:700;font-size:17px">Coordinación</span>
      </span>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:6px">
      <span style="display:flex;align-items:center;gap:8px;width:210px;height:38px;padding:0 8px 0 12px;border:1px solid var(--spira-line-2);border-radius:10px;background:var(--spira-surface);color:var(--spira-muted);font-size:13.5px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--spira-muted)" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <span style="flex:1;text-align:left">Buscar…</span>
        <span style="font-size:11.5px;font-weight:600;color:var(--spira-faint);background:var(--spira-white);border:1px solid var(--spira-line);border-radius:6px;padding:2px 7px">Ctrl K</span>
      </span>
      <span style="width:38px;height:38px;border-radius:10px;display:grid;place-items:center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--spira-ink)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
      </span>
      <span style="position:relative;width:38px;height:38px;border-radius:10px;display:grid;place-items:center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--spira-ink)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
        <span style="position:absolute;top:2px;right:0;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:var(--spira-danger);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--spira-white)">9+</span>
      </span>
      <span style="width:1px;height:26px;background:var(--spira-line);margin:0 4px"></span>
      <span style="display:flex;align-items:center;gap:9px;height:42px;padding:0 8px 0 6px">
        <span style="position:relative;width:32px;height:32px;border-radius:50%;background:var(--spira-surface);border:1.5px solid var(--spira-avatar-ring);color:var(--spira-primary);display:grid;place-items:center;font-family:var(--spira-font-display);font-weight:700;font-size:12px">SC
          <span style="position:absolute;bottom:-1px;right:-1px;width:9px;height:9px;border-radius:50%;background:var(--spira-avatar-ring);border:2px solid var(--spira-white)"></span>
        </span>
        <span style="font-size:13.5px;font-weight:600;color:var(--spira-ink)">Spira Clinic</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--spira-muted)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
      </span>
    </div>
  </header>
  <div style="flex:1;display:flex;min-height:0">
    <aside style="width:64px;flex:0 0 64px;background:var(--spira-white);border-right:1px solid var(--spira-line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px">
      <span style="width:46px;height:46px;border-radius:12px;display:grid;place-items:center">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="var(--spira-muted)" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>
      </span>
      <span style="width:46px;height:46px;border-radius:12px;background:rgba(46,125,116,.14);display:grid;place-items:center">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="var(--spira-track)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
      </span>
      <span style="width:46px;height:46px;border-radius:12px;display:grid;place-items:center">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="var(--spira-muted)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"></path><path d="m8.5 8.5 7 7"></path></svg>
      </span>
      <span style="width:46px;height:46px;border-radius:12px;display:grid;place-items:center;position:relative">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--spira-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="filter:blur(3.5px);opacity:.3;position:absolute"><path d="M9 3h6"></path><path d="M10 3v6.5L4.6 18.9A1.5 1.5 0 0 0 5.9 21.2h12.2a1.5 1.5 0 0 0 1.3-2.3L14 9.5V3"></path><path d="M7.4 15h9.2"></path></svg>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--spira-faint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:relative"><rect width="18" height="11" x="3" y="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </span>
      <span style="width:46px;height:46px;border-radius:12px;display:grid;place-items:center;position:relative">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--spira-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="filter:blur(3.5px);opacity:.3;position:absolute"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1Z"></path><path d="M16 8H8"></path><path d="M16 12H8"></path></svg>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--spira-faint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:relative"><rect width="18" height="11" x="3" y="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </span>
      <span style="margin-top:auto;width:46px;height:46px;border-radius:12px;display:grid;place-items:center">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="var(--spira-muted)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
      </span>
    </aside>
    <aside style="width:220px;flex:0 0 220px;background:var(--spira-surface);border-right:1px solid var(--spira-line);padding:18px 12px">
      <div style="font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--spira-faint);font-weight:700;padding:2px 12px 0">Submódulos</div>
      <nav style="display:flex;flex-direction:column;gap:2px;margin-top:14px">
        <div style="display:flex;align-items:flex-start;gap:10px;padding:8px 12px;border-radius:9px;background:rgba(46,125,116,.12)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--spira-track)" stroke-width="1.9" stroke-linejoin="round" style="flex:0 0 auto;margin-top:1px"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>
          <span style="display:flex;flex-direction:column;gap:1px;min-width:0"><span style="font-size:14px;font-weight:600;line-height:1.35">Resumen</span><span style="font-size:11.5px;line-height:1.35;color:var(--spira-ink-soft)">Cómo viene el día</span></span>
        </div>
        <div style="display:flex;align-items:flex-start;gap:10px;padding:8px 12px;border-radius:9px">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--spira-muted)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;margin-top:1px"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <span style="display:flex;flex-direction:column;gap:1px;min-width:0"><span style="font-size:14px;font-weight:500;line-height:1.35">Pacientes</span><span style="font-size:11.5px;line-height:1.35;color:var(--spira-ink-soft)">Información de pacientes</span></span>
        </div>
        <div style="display:flex;align-items:flex-start;gap:10px;padding:8px 12px;border-radius:9px">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--spira-muted)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;margin-top:1px"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
          <span style="display:flex;flex-direction:column;gap:1px;min-width:0"><span style="font-size:14px;font-weight:500;line-height:1.35">Visitas</span><span style="font-size:11.5px;line-height:1.35;color:var(--spira-ink-soft)">Las visitas de hoy</span></span>
        </div>
        <div style="display:flex;align-items:flex-start;gap:10px;padding:8px 12px;border-radius:9px">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--spira-muted)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;margin-top:1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
          <span style="display:flex;flex-direction:column;gap:1px;min-width:0"><span style="font-size:14px;font-weight:500;line-height:1.35">Para ver médico</span><span style="font-size:11.5px;line-height:1.35;color:var(--spira-ink-soft)">Cola de atención</span></span>
        </div>
        <div style="display:flex;align-items:flex-start;gap:10px;padding:8px 12px;border-radius:9px">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--spira-muted)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;margin-top:1px"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
          <span style="display:flex;flex-direction:column;gap:1px;min-width:0"><span style="font-size:14px;font-weight:500;line-height:1.35">Alertas</span><span style="font-size:11.5px;line-height:1.35;color:var(--spira-ink-soft)">Desvíos y vencimientos</span></span>
        </div>
      </nav>
    </aside>
    <main style="flex:1;display:flex;flex-direction:column;min-width:0">
      <div style="display:flex;align-items:center;gap:12px;padding:20px 26px 4px">
        <div style="min-width:0">
          <div style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--spira-muted)">Spira Coordinación
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--spira-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
            <span style="color:var(--spira-ink);font-weight:600">Resumen</span>
          </div>
          <div style="font-family:var(--spira-font-display);font-weight:700;font-size:24px;letter-spacing:-0.02em;margin-top:1px">Resumen</div>
        </div>
      </div>
      <div style="flex:1;padding:16px 26px 26px">{{ children }}</div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1560,&quot;height&quot;:820}}"></script>
</body>
</html>
