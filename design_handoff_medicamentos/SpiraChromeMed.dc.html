<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/spira-identidad-visual-8ae23286-bc63-4c58-b239-3382adb8fc91/colors_and_type.css">
  <link rel="stylesheet" href="_ds/spira-identidad-visual-8ae23286-bc63-4c58-b239-3382adb8fc91/design_handoff_login/colors_and_type.css">
</helmet>
<div style="width:1360px;height:648px;display:flex;flex-direction:column;font-family:var(--spira-font-text);color:var(--spira-ink);background:var(--spira-paper);border:1px solid var(--spira-line);border-radius:14px;overflow:hidden;box-shadow:0 18px 40px rgba(20,48,46,.14)">

  <!-- ===== top bar ===== -->
  <header style="height:60px;flex:0 0 60px;border-bottom:1px solid var(--spira-line);background:var(--spira-white);display:flex;align-items:center;padding:0 18px 0 20px;gap:14px">
    <div style="display:flex;align-items:center;gap:11px">
      <img src="assets/spira-vilano-petrol.svg" alt="" style="width:26px;height:31px;display:block" />
      <span style="font-family:var(--spira-font-display);font-weight:700;font-size:21px;letter-spacing:-0.02em">Spira</span>
      <span style="width:1px;height:26px;background:var(--spira-line);margin:0 5px"></span>
      <span style="display:inline-flex;align-items:center;gap:8px">
        <span style="width:26px;height:26px;border-radius:7px;background:rgba(201,162,74,.18);display:grid;place-items:center">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--spira-pharma)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"></path><path d="m8.5 8.5 7 7"></path></svg>
        </span>
        <span style="font-family:var(--spira-font-display);font-weight:700;font-size:17px">Pharma</span>
      </span>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:6px">
      <button style="width:38px;height:38px;border-radius:10px;border:none;background:transparent;cursor:pointer;display:grid;place-items:center" title="Tema oscuro">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--spira-ink)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
      </button>
      <button style="display:flex;align-items:center;gap:8px;width:228px;height:38px;padding:0 10px 0 12px;border:1px solid var(--spira-line-2);border-radius:10px;background:var(--spira-surface);cursor:pointer;font-family:var(--spira-font-text);font-size:13.5px;color:var(--spira-muted)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--spira-muted)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <span style="flex:1;text-align:left;white-space:nowrap">Buscar en Spira…</span>
        <span style="font-size:11.5px;font-weight:600;color:var(--spira-faint);background:var(--spira-white);border:1px solid var(--spira-line);border-radius:6px;padding:2px 7px;white-space:nowrap">Ctrl K</span>
      </button>
      <button style="position:relative;width:38px;height:38px;border-radius:10px;border:none;background:transparent;cursor:pointer;display:grid;place-items:center" title="Notificaciones">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--spira-ink)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
        <span style="position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--spira-danger);border:2px solid var(--spira-white)"></span>
      </button>
      <span style="width:1px;height:26px;background:var(--spira-line);margin:0 4px"></span>
      <div style="display:flex;align-items:center;gap:9px;height:42px;padding:0 8px 0 6px">
        <span style="width:32px;height:32px;border-radius:50%;background:var(--spira-primary);color:var(--spira-paper);display:grid;place-items:center;font-family:var(--spira-font-display);font-weight:700;font-size:14px">L</span>
        <span style="font-size:13.5px;font-weight:600;white-space:nowrap;color:var(--spira-muted)">lautaro.molina.scherbovsky</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--spira-muted)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
      </div>
      <button style="width:38px;height:38px;border-radius:10px;border:none;background:transparent;cursor:pointer;display:grid;place-items:center" title="Cerrar sesión">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--spira-muted)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg>
      </button>
    </div>
  </header>

  <!-- ===== body ===== -->
  <div style="flex:1;display:flex;min-height:0">
    <!-- module rail -->
    <aside style="width:64px;flex:0 0 64px;background:var(--spira-white);border-right:1px solid var(--spira-line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px">
      <button style="width:46px;height:46px;border-radius:12px;border:none;background:transparent;cursor:pointer;display:grid;place-items:center" title="Inicio">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="var(--spira-muted)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="14" rx="1"></rect><rect width="7" height="7" x="3" y="14" rx="1"></rect></svg>
      </button>
      <button style="width:46px;height:46px;border-radius:12px;border:none;background:transparent;cursor:default;display:grid;place-items:center">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="var(--spira-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </button>
      <button style="width:46px;height:46px;border-radius:12px;border:none;background:transparent;cursor:default;display:grid;place-items:center">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="var(--spira-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </button>
      <button style="width:46px;height:46px;border-radius:12px;border:none;background:rgba(201,162,74,.16);cursor:pointer;display:grid;place-items:center" title="Spira Pharma">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="var(--spira-pharma)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"></path><path d="m8.5 8.5 7 7"></path></svg>
      </button>
      <button style="width:46px;height:46px;border-radius:12px;border:none;background:transparent;cursor:default;display:grid;place-items:center">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="var(--spira-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </button>
      <div style="margin-top:auto">
        <button style="width:46px;height:46px;border-radius:12px;border:none;background:transparent;cursor:pointer;display:grid;place-items:center" title="Ajustes">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="var(--spira-muted)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
    </aside>

    <!-- submodule panel -->
    <aside style="width:208px;flex:0 0 208px;background:var(--spira-surface);border-right:1px solid var(--spira-line);padding:18px 12px">
      <div style="font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--spira-faint);font-weight:700;padding:2px 12px 0">Submódulos</div>
      <nav style="display:flex;flex-direction:column;gap:2px;margin-top:14px">
        <div style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--spira-ink);font-size:14px;font-weight:500">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--spira-muted)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="14" rx="1"></rect><rect width="7" height="7" x="3" y="14" rx="1"></rect></svg>Resumen
        </div>
        <div style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--spira-ink);font-size:14px;font-weight:500">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--spira-muted)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v5h5"></path></svg>Protocolos
        </div>
        <div style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;background:rgba(201,162,74,.14);color:var(--spira-pharma-solid);font-size:14px;font-weight:600">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--spira-pharma-solid)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"></path><path d="m8.5 8.5 7 7"></path></svg>Medicamentos
        </div>
        <div style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--spira-ink);font-size:14px;font-weight:500">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--spira-muted)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="m9 14 2 2 4-4"></path></svg>Recepción
        </div>
        <div style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--spira-ink);font-size:14px;font-weight:500">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--spira-muted)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.3 7 8.7 5 8.7-5"></path><path d="M12 22V12"></path></svg>Dispensaciones
        </div>
        <div style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--spira-ink);font-size:14px;font-weight:500">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--spira-muted)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="20" y2="10"></line><line x1="18" x2="18" y1="20" y2="4"></line><line x1="6" x2="6" y1="20" y2="16"></line></svg>Reportes
        </div>
      </nav>
      <div style="margin-top:18px;padding:0 12px;font-size:11px;color:var(--spira-faint)">v0.7.0</div>
    </aside>

    <!-- content slot -->
    <main style="flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden">{{ children }}</main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:648}}"></script>
</body>
</html>
