<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dispensación · Paso a paso (B)</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
:root{--ink:var(--spira-ink);--ink-soft:#3D5D59;--paper:var(--spira-paper);--surface:var(--spira-surface);--white:var(--spira-white);--muted:var(--spira-muted);--faint:var(--spira-faint);--line:var(--spira-line);--line2:var(--spira-line-2);--good:var(--spira-good);--warn:var(--spira-warn);--deep:#0B4A44;--danger:var(--spira-danger);--teal:var(--spira-track);--ph:var(--spira-primary);--on:var(--spira-on-accent);--fdisp:var(--spira-font-display);--ftext:var(--spira-font-text);--fmono:var(--spira-font-mono)}
*{box-sizing:border-box}
body{margin:0;font-family:var(--ftext);font-size:14px;color:var(--ink);-webkit-font-smoothing:antialiased;background:#E9E4D8;min-height:100vh;display:flex;justify-content:flex-end}
.mono{font-family:var(--fmono);font-variant-numeric:tabular-nums}
a{color:var(--spira-primary)}a:hover{color:var(--ph)}
.cajon{width:720px;height:100vh;background:var(--paper);box-shadow:-18px 0 48px rgba(20,48,46,.14);display:flex;flex-direction:column;overflow:hidden;position:relative}
.hd{background:var(--white);border-bottom:1px solid var(--line);padding:16px 22px 15px;flex:0 0 auto}
.hd-top{display:flex;align-items:flex-start;gap:10px}
.hd h2{margin:0;font-family:var(--fdisp);font-size:17px;font-weight:700;letter-spacing:-.01em}
.hd .sub{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:5px;font-size:12.5px;color:var(--muted)}
.hd .sub .d{width:3px;height:3px;border-radius:50%;background:var(--line2)}
.icobtn{width:32px;height:32px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.icobtn:hover{background:var(--surface);border-color:var(--line);color:var(--ink)}
.split{flex:1;display:flex;min-height:0}
.rail{width:240px;flex:0 0 auto;background:var(--surface);border-right:1px solid var(--line);padding:18px 15px;display:flex;flex-direction:column;overflow-y:auto}
.rail .eyebrow{margin-bottom:16px;display:block}
.rflow{position:relative}
.rflow:before{content:"";position:absolute;left:11.5px;top:14px;bottom:14px;width:1.5px;background:var(--line)}
.rflow i.prog{position:absolute;left:11.5px;top:14px;width:1.5px;background:rgba(46,125,116,.5)}
.rnode{position:relative;display:flex;gap:11px;padding:0 0 16px}
.rnode:last-child{padding-bottom:0}
.dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;border:1.5px solid var(--line2);color:var(--faint);background:var(--surface);flex:0 0 auto;z-index:1}
.rnode.cur .dot{background:var(--ph);border-color:var(--ph);color:#fff;box-shadow:0 0 0 3px rgba(15,95,87,.16)}
.rnode.done .dot{background:rgba(46,125,116,.14);border-color:rgba(46,125,116,.5);color:var(--teal)}
.rnode .tt{font-size:13px;color:var(--muted);line-height:1.3;padding-top:3px}
.rnode.cur .tt{color:var(--ink);font-weight:700}
.rnode.done .tt{color:var(--ink-soft)}
.rbody{flex:1;min-width:0}
.reqs{margin-top:9px;background:var(--white);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.req{display:flex;align-items:center;gap:8px;padding:7px 9px;font-size:11.5px;color:var(--muted);line-height:1.25}
.req+.req{border-top:1px solid var(--line)}
.req .tx{flex:1;min-width:0;line-height:1.3}
.req.hasct .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.req .ct{font-family:var(--fmono);font-size:10.5px;color:var(--faint);flex:0 0 auto}
.req .gl{width:13px;height:13px;flex:0 0 auto;display:grid;place-items:center;color:var(--faint)}
.req .gl .ring{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line2)}
.req.on{color:var(--ink);font-weight:600;background:rgba(15,95,87,.08)}
.req.on .gl .ring{border-color:var(--ph);border-width:2.5px}
.req.on .ct{color:var(--deep)}
.req.ok{color:var(--ink-soft)}
.req.ok .gl{color:var(--good)}
.req.ok .ct{color:var(--good)}
.railfoot{margin-top:auto;padding-top:18px;display:flex;align-items:flex-start;gap:8px;font-size:11.5px;color:var(--ink-soft);line-height:1.4}
.railfoot .pend{margin-top:4px}
.work{flex:1;min-width:0;display:flex;flex-direction:column}
.body{flex:1;overflow-y:auto;padding:20px 22px 24px}
.ft{flex:0 0 auto;background:var(--white);border-top:1px solid var(--line);padding:13px 22px;display:flex;flex-direction:column;gap:10px}
.ftrow{display:flex;align-items:center;gap:10px}
.btn{height:42px;padding:0 16px;border-radius:10px;font-family:var(--ftext);font-size:14px;font-weight:600;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.sm{height:34px;padding:0 11px;font-size:12.5px}
.btn.pri{background:var(--ph);color:var(--on)}.btn.pri:hover{filter:brightness(1.07)}
.btn.teal{background:var(--teal);color:#fff}.btn.teal:hover{filter:brightness(1.07)}
.btn.out{background:var(--white);border-color:var(--line2);color:var(--ink)}.btn.out:hover{border-color:var(--ph)}
.btn.ghost{background:transparent;color:var(--muted)}.btn.ghost:hover{color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:default;filter:none}
.spacer{flex:1}
.h6{font-family:var(--fdisp);font-size:16px;font-weight:700;letter-spacing:-.005em;margin:0 0 4px}
.lede{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 16px}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.stack{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:11px;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:var(--white)}
.item.ok{background:rgba(92,138,90,.10);border-color:rgba(92,138,90,.34)}
.item .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface);color:var(--muted);flex:0 0 auto}
.item.ok .ico{background:rgba(92,138,90,.18);color:var(--good)}
.item .nm{font-size:13.5px;font-weight:600}
.item .mt{font-size:11.5px;color:var(--muted);margin-top:2px}
.item .qty{font-family:var(--fmono);font-size:13px}
.groups{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.ctop{display:flex;align-items:baseline;gap:10px;margin:18px 0 12px}
.ctop .k{font-size:23px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.ctop .l{font-size:12.5px;color:var(--muted)}
.ctop .r{margin-left:auto;font-size:12px;font-weight:600;color:var(--deep)}
.ctop .r.ok{color:var(--good)}
.ccard{position:relative;background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ccard .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(92,138,90,.13);width:0;transition:width .18s}
.ccard.full{border-color:rgba(92,138,90,.4)}
.in{position:relative;display:flex;align-items:center;gap:12px;padding:14px 15px}
.in .nm{font-size:14.5px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.in>div.nmcol{flex:1 1 auto;min-width:150px}
.in .mt{font-size:11.5px;color:var(--muted);margin-top:3px}
.dial{width:50px;height:50px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--deep);position:relative}
.dial:after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--white)}
.ccard.full .dial:after{background:#F1F6F0}
.dial span{position:relative;z-index:1}
.dial.full{color:var(--good)}
.fcol{border-left:1px solid var(--line);padding-left:11px;flex:0 1 92px;min-width:0}
.cancel{border:0;background:transparent;font-family:var(--ftext);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:7px}
.cancel:hover{color:var(--danger);background:rgba(166,72,59,.09)}
.fcol{border-left:1px solid var(--line);padding-left:12px;flex:0 1 92px;min-width:0}
.grp.done .fcol{border-left-color:rgba(92,138,90,.24)}
.fcol .lbl{font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.fcol .val{font-size:12.5px;margin-top:2px;line-height:1.25}
.ccard.full .fcol{border-left-color:rgba(92,138,90,.26)}
.tick{color:var(--good);display:flex;flex:0 0 auto}
.sust{border:1px solid var(--line2);background:var(--white);font-family:var(--ftext);font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;padding:6px 10px;border-radius:8px;flex:0 0 auto}
.sust:hover{border-color:var(--ph);color:var(--deep)}
.sust.on{background:var(--ph);border-color:var(--ph);color:var(--on)}
.row.open{background:var(--surface)}
.sust{white-space:nowrap;padding:6px 9px}
.cancel{white-space:nowrap}
.swap{position:relative;padding:12px 14px 13px;background:var(--surface);border-top:1px solid var(--line2)}
.swaplb{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:9px}
.swaplb b{letter-spacing:.02em;text-transform:none;font-size:11.5px;color:var(--ink-soft)}
.alt{display:flex;align-items:center;gap:11px;padding:9px 11px;background:var(--white);border:1px solid var(--line);border-radius:9px}
.alt+.alt{margin-top:7px}
.alt .anm{font-size:13px;font-weight:600}
.alt .amt{font-size:11px;color:var(--muted);margin-top:2px}
.alt .pick{margin-left:auto;height:30px;padding:0 11px;border-radius:8px;border:0;background:var(--ph);color:var(--on);font-family:var(--ftext);font-size:12px;font-weight:600;cursor:pointer;flex:0 0 auto}
.alt.no{opacity:.55}
.alt.no .pick{background:var(--surface);border:1px solid var(--line);color:var(--faint);cursor:default}
.swapfoot{margin-top:10px;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.bc{display:flex;align-items:center;gap:8px;margin-top:7px}
.bc .bars{color:var(--ink);opacity:.78;display:flex;line-height:0}
.item.ok .bc .bars{opacity:.4}
.bc .num{font-family:var(--fmono);font-size:10.5px;letter-spacing:.08em;color:var(--muted)}
.item .st{font-size:11.5px;color:var(--muted);min-width:72px;text-align:right}
.item.ok .st{color:var(--good);font-weight:600}
.scan{display:flex;align-items:center;gap:10px}
.scan input{flex:1;min-width:0;height:52px;border-radius:12px;border:1px solid var(--line2);background:var(--white);padding:0 16px;font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink);outline:none}
.scan input::placeholder{color:var(--faint)}
.scan input:focus{border-color:var(--ph);box-shadow:0 0 0 4px rgba(15,95,87,.14)}
.err{display:flex;gap:8px;margin-top:11px;padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.4;background:rgba(166,72,59,.08);border:1px solid rgba(166,72,59,.28);color:var(--danger)}
.hint{margin-top:11px;font-size:12px;color:var(--muted)}
.note{display:flex;gap:9px;align-items:flex-start;margin-top:16px;padding:11px 13px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.45}
.pend{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:0 0 auto}
.comp{border:1px solid rgba(46,125,116,.4);background:rgba(46,125,116,.09);border-radius:14px;padding:20px;text-align:center}
.comp .n{font-family:var(--fdisp);font-size:38px;font-weight:700;color:var(--teal);letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.comp .l{font-size:12px;color:var(--ink-soft);margin-top:5px}
/* tarjeta IP con previsualización */
.ipcard{display:flex;gap:13px;padding:13px 14px;border-radius:12px;margin-bottom:16px;align-items:center;background:rgba(15,95,87,.09);border:1px solid rgba(15,95,87,.30)}
.ipcard.ok{background:rgba(46,125,116,.08);border-color:rgba(46,125,116,.26)}
.ipcard .txt{flex:1;min-width:0}
.ipcard .t1{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.ipcard .t2{font-size:11.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ipcard .acts{display:flex;gap:7px;flex:0 0 auto}
.thumb{width:62px;height:80px;flex:0 0 auto;border-radius:5px;overflow:hidden;background:var(--white);border:1px solid var(--line2);box-shadow:0 2px 6px rgba(20,48,46,.10);cursor:zoom-in;position:relative}
.thumb .mini{width:620px;transform:scale(.1);transform-origin:top left;pointer-events:none}
.thumb:hover{border-color:var(--ph)}
.thumb .zoom{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,48,46,.42);color:#fff;opacity:0;transition:opacity .14s}
.thumb:hover .zoom{opacity:1}
/* hoja */
.sheet{width:100%;padding:30px 34px 34px;font-family:var(--ftext);color:var(--ink);background:var(--white)}
.sheet .sh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1.5px solid var(--ink);padding-bottom:12px}
.sheet .brand{font-family:var(--fdisp);font-size:19px;font-weight:800;letter-spacing:-.015em}
.sheet .brand span{display:block;font-family:var(--ftext);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.sheet .sh .rt{text-align:right;font-size:10.5px;color:var(--muted);line-height:1.5}
.sheet h1{font-family:var(--fdisp);font-size:16.5px;font-weight:700;margin:20px 0 3px;letter-spacing:-.01em}
.sheet .st{font-size:11.5px;color:var(--muted);margin:0 0 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px 26px;margin-bottom:20px}
.fld{border-bottom:1px solid var(--line);padding-bottom:6px}
.fld dt{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 3px}
.fld dd{margin:0;font-size:12.5px;font-weight:500}
.sheet table{width:100%;border-collapse:collapse;margin-bottom:18px}
.sheet th{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);text-align:left;padding:0 8px 6px 0;border-bottom:1px solid var(--ink)}
.sheet td{font-size:12px;padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.sheet .decl{font-size:11.5px;line-height:1.6;color:var(--ink-soft);border-left:2px solid var(--line2);padding-left:12px;margin-bottom:24px}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-bottom:20px}
.sig{border-top:1px solid var(--ink);padding-top:6px;font-size:10.5px;color:var(--muted)}
.sig b{display:block;font-size:11.5px;color:var(--ink);margin-bottom:2px}
.sfoot{display:flex;justify-content:space-between;font-size:9.5px;color:var(--faint);border-top:1px solid var(--line);padding-top:9px}
/* visor */
.viewer{position:absolute;inset:0;background:rgba(20,48,46,.62);backdrop-filter:blur(3px);display:flex;flex-direction:column;z-index:20;opacity:0;pointer-events:none;transition:opacity .16s}
.viewer.on{opacity:1;pointer-events:auto}
.vbar{flex:0 0 auto;background:var(--ink);color:var(--paper);padding:11px 16px;display:flex;align-items:center;gap:10px}
.vbar .fn{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar .fm{font-size:11.5px;color:rgba(244,241,234,.6);white-space:nowrap}
.vbtn{height:30px;min-width:30px;padding:0 9px;border-radius:8px;border:1px solid rgba(244,241,234,.22);background:transparent;color:var(--paper);font-family:var(--ftext);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;justify-content:center;cursor:pointer}
.vbtn:hover{background:rgba(244,241,234,.14)}
.vbtn.solid{background:var(--ph);border-color:var(--ph);color:var(--on)}
.vzoom{display:flex;align-items:center;gap:2px;border:1px solid rgba(244,241,234,.22);border-radius:8px;padding:2px}
.vzoom button{width:26px;height:26px;border:0;background:transparent;color:var(--paper);border-radius:6px;cursor:pointer;font-size:15px;line-height:1}
.vzoom button:hover{background:rgba(244,241,234,.14)}
.vzoom .lv{font-family:var(--fmono);font-size:11.5px;padding:0 4px;min-width:42px;text-align:center;color:rgba(244,241,234,.85)}
.vscroll{flex:1;overflow:auto;padding:22px;display:flex;justify-content:center}
.vpage{width:620px;flex:0 0 auto;transform-origin:top center;box-shadow:0 18px 44px rgba(0,0,0,.34);align-self:flex-start}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:10px;font-size:13px;display:flex;gap:9px;align-items:center;box-shadow:0 12px 32px rgba(20,48,46,.2);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:15}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
</style></head>
<body>
<div class="cajon" id="B"></div>
<script src="dispensacion-b.js"></script>
</body></html>
